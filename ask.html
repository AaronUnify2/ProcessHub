<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ask Council — experimental</title>
<link rel="stylesheet" href="css/gate.css">
<style>
/* ===========================================================================
   Ask — an experimental FAQ finder.
   Matches a question typed in plain words to the published FAQ answers, using
   a small sentence-embedding model (all-MiniLM-L6-v2) that runs in the browser.
   It never writes an answer of its own: it only shows the published ones.
   For council staff while it is an experiment: it opens only once the
   sign-in (js/gate.js) has confirmed a Process Hub token.
   =========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --text: #1D1D1F;
  --text-soft: #6E6E73;
  --border: rgba(0, 0, 0, 0.09);
  --border-strong: rgba(0, 0, 0, 0.18);
  --accent: #0A66C2;
  --accent-soft: #EAF2FB;
  --warn: #B45309;
  --warn-soft: #FEF6E7;
  --good: #2E7D53;
  --good-soft: #EAF5EE;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

a { color: var(--accent); }

/* ---- Header ---- */

.ask-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ask-brand { font-weight: 700; color: var(--text); text-decoration: none; }
.ask-tag {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--warn);
  background: var(--warn-soft);
  padding: 2px 8px;
  border-radius: 10px;
}
.ask-status {
  margin-left: auto;
  font-size: 0.82rem;
  color: var(--text-soft);
  text-align: right;
}
.ask-status.ready { color: var(--good); }
.ask-status.error { color: #C0392B; }

/* ---- Conversation ---- */

.chat {
  flex: 1;
  overflow-y: auto;
  position: relative;
  padding: 18px 16px 8px;
}
.chat-inner { max-width: 760px; margin: 0 auto; }

.msg { display: flex; margin-bottom: 14px; }
.msg.user { justify-content: flex-end; }

.bubble {
  max-width: 100%;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.msg.user .bubble {
  max-width: 85%;
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  border-bottom-right-radius: 4px;
}
.msg.bot .bubble { border-bottom-left-radius: 4px; width: 100%; }
.bubble p + p { margin-top: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font: inherit;
  font-size: 0.85rem;
  padding: 5px 11px;
  border-radius: 14px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---- A matched FAQ ---- */

.match {
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-top: 10px;
  background: var(--surface);
  overflow: hidden;
}
.match.best { border-color: var(--accent); }
.match-head {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  background: none;
  border: 0;
  padding: 10px 12px;
  cursor: pointer;
  color: var(--text);
}
.match-head:hover { background: var(--bg); }
.match-where { font-size: 0.76rem; color: var(--text-soft); }
.match-q { font-weight: 600; margin-top: 1px; }
.match-q::after { content: ' ▾'; color: var(--text-soft); font-weight: 400; }
.match.open .match-q::after { content: ' ▴'; }
.match-snip { font-size: 0.88rem; color: var(--text-soft); margin-top: 3px; }
.match.open .match-snip { display: none; }
.match-score {
  display: inline-block;
  font-size: 0.7rem;
  padding: 0 6px;
  margin-left: 6px;
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-soft);
  vertical-align: 1px;
}

.match-body {
  display: none;
  padding: 4px 12px 12px;
  border-top: 1px solid var(--border);
}
.match.open .match-body { display: block; }
.match-foot { margin-top: 10px; font-size: 0.85rem; }

/* The published answer HTML, as the public FAQ page uses it. */
.answer { font-size: 0.93rem; overflow-x: auto; }
.answer p, .answer ul, .answer ol, .answer table, .answer div.note,
.answer div.warn, .answer div.term { margin-top: 8px; }
.answer ul, .answer ol { padding-left: 22px; }
.answer table { border-collapse: collapse; font-size: 0.85rem; min-width: 100%; }
.answer th, .answer td { border: 1px solid var(--border-strong); padding: 4px 7px; text-align: left; vertical-align: top; }
.answer th { background: var(--bg); }
.answer .note, .answer .term { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.answer .warn { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; }
.answer .faq-var { font-weight: 600; }

.fallback {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--good-soft);
  font-size: 0.9rem;
}

.more {
  font: inherit;
  font-size: 0.85rem;
  margin-top: 8px;
  background: none;
  border: 0;
  color: var(--accent);
  cursor: pointer;
  padding: 2px 0;
}

/* ---- Input ---- */

.composer {
  flex-shrink: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.composer form { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
.composer input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 16px; /* 16px stops iOS zooming in on focus */
  padding: 10px 14px;
  border: 1px solid var(--border-strong);
  border-radius: 22px;
  background: var(--bg);
  color: var(--text);
}
.composer input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.composer button {
  font: inherit;
  font-weight: 600;
  padding: 10px 18px;
  border: 0;
  border-radius: 22px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.composer button:disabled { opacity: 0.45; cursor: default; }
.composer-note {
  max-width: 760px;
  margin: 6px auto 0;
  font-size: 0.74rem;
  color: var(--text-soft);
  text-align: center;
}

@media (max-width: 560px) {
  .ask-header { padding: 8px 12px; flex-wrap: wrap; }
  .ask-status { width: 100%; margin-left: 0; text-align: left; }
  .chat { padding: 12px 10px 6px; }
  .composer { padding-left: 10px; padding-right: 10px; }
}
</style>
</head>
<body class="gated">

<header class="ask-header">
  <a class="ask-brand" href="index.html" title="Process Hub">Ask Council</a>
  <span class="ask-tag">Experimental</span>
  <span class="ask-status" id="status">Starting…</span>
</header>

<main class="chat" id="chat">
  <div class="chat-inner" id="chatInner"></div>
</main>

<footer class="composer">
  <form id="askForm" autocomplete="off">
    <input type="text" id="askInput" placeholder="Ask a question in your own words…"
           aria-label="Your question" enterkeyhint="send">
    <button type="submit" id="askButton">Ask</button>
  </form>
  <p class="composer-note">Finds the matching answer in Council's published FAQ. Your question stays on this device.</p>
</footer>

<!-- The model runs in a background worker, so the page stays responsive while
     it reads the FAQ. The library and the model are copies kept in this
     repository under vendor/ (see vendor/README.md), so nothing is fetched
     from anyone else's servers and nothing changes unless we change it. The
     browser keeps the model after the first visit. -->
<script type="text/plain" id="workerSource">
var extractor = null;

self.onmessage = async function (ev) {
  var msg = ev.data;
  try {
    if (msg.type === 'load') {
      var lib = await import(msg.base + 'vendor/transformers-3.0.2/transformers.min.js');
      lib.env.allowRemoteModels = false;
      lib.env.allowLocalModels = true;
      lib.env.localModelPath = msg.base + 'vendor/models/';
      lib.env.backends.onnx.wasm.wasmPaths = msg.base + 'vendor/transformers-3.0.2/';
      extractor = await lib.pipeline('feature-extraction', msg.model, {
        dtype: 'q8',
        progress_callback: function (p) {
          self.postMessage({ type: 'progress', file: p.file || '', status: p.status, progress: p.progress || 0 });
        }
      });
      self.postMessage({ id: msg.id, ok: true });
    } else if (msg.type === 'embed') {
      var out = await extractor(msg.texts, { pooling: 'mean', normalize: true });
      self.postMessage({ id: msg.id, ok: true, data: out.data, dims: out.dims });
    }
  } catch (err) {
    self.postMessage({ id: msg.id, ok: false, error: String((err && err.message) || err) });
  }
};
</script>

<!-- Fingerprints: the model's reading of every FAQ question and every passage
     of every answer, worked out ahead of time so a visitor's browser doesn't
     have to. Each is keyed by a hash of the exact text read, so when a
     question or answer is edited and published, its old fingerprint simply
     stops matching and the browser works out the new one itself (and keeps
     it). The block also carries, for each question, the fingerprints of other
     ways people ask it ("aliases", from "Also asked as" in Process Hub), and
     which questions are everyday ones ("boost"); only fingerprints, never the
     phrasings' text. To refresh it all: open Process Hub with the published
     content (no local changes), run copy(await Probe.exportFingerprints()) in
     the browser console, and paste the result over the contents of this block. -->

// with a keyword score (see score()), roughly 0 to 1.
var STRONG = 0.55;   // show it as "this should answer it"
var WEAK = 0.38;     // below this, say we couldn't find it

var SHOW_MORE = 3;   // extra matches behind "Show more"
var BOOST = 0.03;    // the lift for an everyday question: a tie-breaker (as in Process Hub)
var ALIAS_DISCOUNT = 0.05;   // a phrasing match counts a little below the question's own (as in Process Hub)

var Ask = {
  faqs: [],          // { tabId, tabLabel, group, q, a, text, chunks, qVec, cVecs, terms, qTerms }
  idf: {},
  baked: {},         // key -> Float32Array, from the fingerprints block
  aliases: {},       // question key -> keys of its other phrasings' fingerprints
  boost: {},         // question key -> true, for an everyday question
  extra: {},         // key -> Float32Array, worked out in this browser
  worker: null,
  ready: false,
  phone: '1300 697 372',
  requestUrl: 'https://crm.sdrc.qld.gov.au/webinput/customform/categorylist?show_tiles=y'

window.Ask = Ask;   // for testing, and for refreshing the fingerprints, in a console

// Ask.whenReady settles once the model has loaded and every question has a
// fingerprint. A question typed before then waits for it.
var markReady, markFailed;
Ask.whenReady = new Promise(function (resolve, reject) { markReady = resolve; markFailed = reject; });
Ask.whenReady.catch(function () {});

// ---------------------------------------------------------------- utilities

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// HTML to plain text, using the browser's own parser.
function plain(html) {
  var doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  doc.querySelectorAll('td, th, li, p, div, br').forEach(function (el) {
    el.insertAdjacentText('afterend', ' ');
  });
  return doc.body.textContent.replace(/\s+/g, ' ').trim();
}

// A 53-bit string hash (cyrb53), used to key fingerprints by their text.
function hash(str) {
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (var i = 0; i < str.length; i++) {
    var ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

function setStatus(text, cls) {
  var el = $('status');
  el.textContent = text;
  el.className = 'ask-status' + (cls ? ' ' + cls : '');
}

// A fingerprint is 384 numbers. Stored, each is squeezed into one byte
// (-127 to 127) and the lot written as base64: about 0.5 KB each. Unpacked,
// it is scaled back to length 1, which is all the matching needs.
function pack(vec) {
  var max = 0;
  for (var i = 0; i < vec.length; i++) max = Math.max(max, Math.abs(vec[i]));
  var bytes = new Int8Array(vec.length);
  for (var j = 0; j < vec.length; j++) bytes[j] = Math.round(vec[j] / (max || 1) * 127);
  var s = '';
  var u = new Uint8Array(bytes.buffer);
  for (var k = 0; k < u.length; k++) s += String.fromCharCode(u[k]);
  return btoa(s);
}
function unpack(b64) {
  var s = atob(b64);
  var vec = new Float32Array(s.length);
  var len = 0;
  for (var i = 0; i < s.length; i++) {
    var b = s.charCodeAt(i);
    vec[i] = b > 127 ? b - 256 : b;
    len += vec[i] * vec[i];
  }
  len = Math.sqrt(len) || 1;
  for (var j = 0; j < vec.length; j++) vec[j] /= len;
  return vec;
}

function dot(a, b) {
  var s = 0;
  for (var i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
}

// ------------------------------------------------------------ keyword score
//
// The model knows general English, not Council's terms (NPPR, GBO, Form 16,
// 1080). A light keyword score sits alongside it so exact terms still count.

var STOP = ('a an and are as at be by can could do does for from had has have how i if in into is it its ' +
  'me my of on or our should so that the their them then there these they this to was we what when where ' +
  'which who why will with would you your yours am get got im ive dont cant about any some need want ' +
  'tell know please just much many also there').split(' ');
var STOPSET = {};
STOP.forEach(function (w) { STOPSET[w] = true; });

// Everyday words people type, and the words the FAQ uses for the same thing.
// A match adds the FAQ's words to the question before it is searched, so
// "where's the tip" finds the waste facilities. Keep it short and obvious.
var GLOSSARY = [
  [/\b(the )?tip\b|\bdump\b|\btransfer station\b/i, 'waste facility'],
  [/\b(fridges?|freezers?|washing machines?|dryers?|dishwashers?|ovens?|stoves?)\b/i, 'whitegoods'],
  [/\bchooks?\b/i, 'chickens poultry livestock'],
  [/\brego\b/i, 'registration'],
  [/\b(holiday (house|home)|investment property|second home|rental property|beach house|weekender)\b/i,
    'NPPR non-principal place of residence rate category'],
  [/\bgranny flat\b/i, 'secondary dwelling'],
  [/\b(wheelie )?bins? (day|night)\b|\brubbish day\b/i, 'bin collection day'],
  [/\bin town\b|\bhouse block\b|\bsuburb/i, 'urban'],
  [/\b(farm|acreage|property out of town)\b/i, 'rural']
];

function expand(question) {
  var extra = [];
  GLOSSARY.forEach(function (g) { if (g[0].test(question)) extra.push(g[1]); });
  return extra.length ? question + ' (' + extra.join('; ') + ')' : question;
}

function stem(w) {
  if (w.length > 5 && /ing$/.test(w)) return w.slice(0, -3);
  if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
  if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
  return w;
}

function terms(text) {
  var out = {};
  (text.toLowerCase().replace(/[’']/g, '').match(/[a-z0-9]+/g) || []).forEach(function (w) {
    if (!STOPSET[w] && w.length > 1) out[stem(w)] = true;
  });
  return out;
}

function keywordScore(qTerms, faq) {
  var total = 0, hit = 0;
  Object.keys(qTerms).forEach(function (t) {
    var w = Ask.idf[t] || Ask.maxIdf;
    total += w;
    if (faq.qTerms[t]) hit += w;
    else if (faq.terms[t]) hit += w * 0.5;
  });
  return total ? hit / total : 0;
}

// ------------------------------------------------------------ loading the FAQ

// Long answers are read in short passages, so one sentence deep in an answer
// ("rentals, holiday houses, second homes") can still be found.
function chunk(text) {
  var sentences = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
  var out = [], cur = '';
  sentences.forEach(function (s) {
    if (cur && (cur + s).length > 380) { out.push(cur.trim()); cur = ''; }
    cur += s;
  });
  if (cur.trim()) out.push(cur.trim());
  return out.slice(0, 16);
}

// What the model reads for each FAQ. The tab and section give a short question
// like "Can I bring my dog?" its context (camping, not pets at home).
function questionText(f) {
  return f.tabLabel + (f.group ? ' — ' + f.group : '') + ': ' + f.q;
}
function chunkText(f, c) {
  return f.q + ' ' + c;
}

async function loadFaqs() {
  var res = await fetch(FAQ_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error('Could not load the FAQ (' + res.status + ')');
  var data = await res.json();

  (data.variables || []).forEach(function (v) {
    if (v.id === 'phone_1300_697_372') Ask.phone = v.value;
    if (v.id === 'url_crm_sdrc_qld_gov_au') Ask.requestUrl = v.value;
  });

  var faqs = [];
  (data.tabs || []).forEach(function (tab) {
    var group = '';
    (tab.items || []).forEach(function (item) {
      if (item.type === 'group') { group = plain(item.title); return; }
      if (item.type !== 'faq') return;
      var q = plain(item.q);
      var text = plain(item.a);
      var f = {
        tabId: tab.id,
        tabLabel: plain(tab.label),
        group: group,
        q: q,
        a: item.a,
        text: text,
        chunks: chunk(text),
        terms: terms(q + ' ' + group + ' ' + tab.label + ' ' + text),
        qTerms: terms(q)
      };
      f.qKey = hash(questionText(f));
      f.cKeys = f.chunks.map(function (c) { return hash(chunkText(f, c)); });
      faqs.push(f);
    });
  });

  // Inverse document frequency for the keyword score.
  var df = {};
  faqs.forEach(function (f) { Object.keys(f.terms).forEach(function (t) { df[t] = (df[t] || 0) + 1; }); });
  Ask.maxIdf = Math.log(faqs.length + 1);
  Object.keys(df).forEach(function (t) { Ask.idf[t] = Math.log((faqs.length + 1) / df[t]); });

  Ask.faqs = faqs;
}

// ------------------------------------------------------------ fingerprints

function loadFingerprints() {
  try {
    var block = JSON.parse($('fingerprints').textContent || '{}');
    if (block.model === MODEL && block.items) {
      Object.keys(block.items).forEach(function (k) { Ask.baked[k] = unpack(block.items[k]); });
      Ask.aliases = block.aliases || {};
      (block.boost || []).forEach(function (k) { Ask.boost[k] = true; });
    }
  } catch (err) {
    console.warn('Fingerprints block unreadable', err);
  }
  try {
    localStorage.removeItem('processhub.ask.vectors');   // the first version's cache
    var saved = JSON.parse(localStorage.getItem(EXTRA_KEY) || 'null');
    if (saved && saved.model === MODEL && saved.items) {
      Object.keys(saved.items).forEach(function (k) { Ask.extra[k] = unpack(saved.items[k]); });
    }
  } catch (err) {
    // Storage blocked: anything missing is worked out again.
  }
}

function lookup(key) {
  return Ask.baked[key] || Ask.extra[key] || null;
}

// Keep what this browser worked out, but only what the current FAQ still uses.
function saveExtra() {
  try {
    var items = {};
    Ask.faqs.forEach(function (f) {
      [f.qKey].concat(f.cKeys).forEach(function (k) {
        if (Ask.extra[k] && !Ask.baked[k]) items[k] = pack(Ask.extra[k]);
      });
    });
    if (Object.keys(items).length) localStorage.setItem(EXTRA_KEY, JSON.stringify({ model: MODEL, items: items }));
    else localStorage.removeItem(EXTRA_KEY);
  } catch (err) {
    // Storage full or blocked: they are simply worked out again next time.
  }
}

// Attach every fingerprint already known, and list the texts still to read.
function attachFingerprints() {
  var questions = [], passages = [];
  Ask.faqs.forEach(function (f) {
    f.qVec = lookup(f.qKey);
    if (!f.qVec) questions.push({ key: f.qKey, text: questionText(f), faq: f });
    // Other phrasings exist only as fingerprints; a question edited since
    // they were made has none until the block is refreshed.
    f.aliasKeys = (Ask.aliases[f.qKey] || []).filter(function (k) { return lookup(k); });
    f.aliasVecs = f.aliasKeys.map(lookup);
    f.common = !!Ask.boost[f.qKey];
    f.cVecs = [];
    f.cKeys.forEach(function (k, i) {
      var v = lookup(k);
      if (v) f.cVecs.push(v);
      else passages.push({ key: k, text: chunkText(f, f.chunks[i]), faq: f });
    });
  });
  return { questions: questions, passages: passages };
}

// Every fingerprint the current FAQ uses, keeping the phrasings and lifts
// already in the block. Process Hub's Probe.exportFingerprints() is the
// usual way to refresh the block, since only it knows new phrasings.
Ask.exportFingerprints = function () {
  var items = {}, aliases = {}, boost = [];
  Ask.faqs.forEach(function (f) {
    items[f.qKey] = pack(f.qVec);
    f.cKeys.forEach(function (k) {
      var v = lookup(k);
      if (v) items[k] = pack(v);
    });
    if (f.aliasKeys.length) {
      f.aliasKeys.forEach(function (k) { items[k] = pack(lookup(k)); });
      aliases[f.qKey] = f.aliasKeys;
    }
    if (f.common) boost.push(f.qKey);
  });
  return JSON.stringify({ model: MODEL, made: new Date().toISOString().slice(0, 10),
    aliases: aliases, boost: boost, items: items });
};

// ------------------------------------------------------------ the model

// Talking to the worker: each request gets an id, and its reply settles the
// promise with that id.
var pending = {}, nextId = 1;

function startWorker() {
  var blob = new Blob([$('workerSource').textContent], { type: 'text/javascript' });
  Ask.worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
  Ask.worker.onmessage = function (ev) {
    var msg = ev.data;
    if (msg.type === 'progress') {
      if (msg.status === 'progress' && /onnx$/.test(msg.file)) {
        setStatus('Loading the language model… ' + Math.round(msg.progress) + '%');
      }
      return;
    }
    var p = pending[msg.id];
    delete pending[msg.id];
    if (p) msg.ok ? p.resolve(msg) : p.reject(new Error(msg.error));
  };
  Ask.worker.onerror = function (ev) {
    var err = new Error(ev.message || 'The model could not start');
    Object.keys(pending).forEach(function (id) { pending[id].reject(err); delete pending[id]; });
  };
}

function send(msg) {
  return new Promise(function (resolve, reject) {
    msg.id = nextId++;
    pending[msg.id] = { resolve: resolve, reject: reject };
    Ask.worker.postMessage(msg);
  });
}

// The model runs one job at a time. Calls queue up here, so a question typed
// while new passages are being read waits for one small batch at most.
var queue = Promise.resolve();

function embed(texts) {
  var job = queue.then(async function () {
    var out = await send({ type: 'embed', texts: texts });
    var dim = out.dims[out.dims.length - 1];
    var vecs = [];
    for (var i = 0; i < texts.length; i++) vecs.push(out.data.slice(i * dim, (i + 1) * dim));
    return vecs;
  });
  queue = job.catch(function () {});
  return job;
}

// Read texts that have no fingerprint yet (new or edited since the
// fingerprints were made), and file each one where it belongs.
async function readMissing(jobs, batch, label, put) {
  for (var i = 0; i < jobs.length; i += batch) {
    var slice = jobs.slice(i, i + batch);
    var vecs = await embed(slice.map(function (j) { return j.text; }));
    slice.forEach(function (j, n) {
      Ask.extra[j.key] = vecs[n];
      put(j, vecs[n]);
    });
    setStatus(label + ' ' + Math.round(Math.min(i + batch, jobs.length) / jobs.length * 100) + '%');
  }
}

// ------------------------------------------------------------ matching

// The question (or the closest of its other phrasings, a little discounted),
// the best passage of the answer, and the words they share — plus the lift for an everyday
// question. Process Hub's Probe scores exactly the same way.
function score(f, qVec, qTerms) {
  var sq = dot(qVec, f.qVec);
  var also = 0;
  f.aliasVecs.forEach(function (v) { also = Math.max(also, dot(qVec, v) - ALIAS_DISCOUNT); });
  var sa = 0;
  f.cVecs.forEach(function (v) { sa = Math.max(sa, dot(qVec, v)); });
  var sqAll = Math.max(sq, also);
  var sem = Math.max(sqAll, 0.5 * sqAll + 0.5 * sa);
  var total = 0.8 * sem + 0.2 * keywordScore(qTerms, f) + (f.common ? BOOST : 0);
  return { total: total, sem: sem, sq: sq, also: also, sa: sa };
}

async function search(question, limit) {
  await Ask.whenReady;
  question = expand(question);
  var vec = (await embed([question]))[0];
  var qTerms = terms(question);
  return Ask.faqs
    .map(function (f, i) { var s = score(f, vec, qTerms); return { faq: f, index: i, score: s.total, parts: s }; })
    .sort(function (a, b) { return b.score - a.score; })
    .slice(0, limit || 10);
}
Ask.search = search;

// ------------------------------------------------------------ rendering

function addMessage(who, html) {
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + who;
  wrap.innerHTML = '<div class="bubble">' + html + '</div>';
  $('chatInner').appendChild(wrap);
  $('chat').scrollTop = $('chat').scrollHeight;
  return wrap.querySelector('.bubble');
}

// Links inside answers point at tabs of the public FAQ page (#water); make
// them go there, in a new tab.
function answerHtml(html) {
  var box = document.createElement('div');
  box.innerHTML = html;
  box.querySelectorAll('a[href]').forEach(function (a) {
    var href = a.getAttribute('href');
    if (href.charAt(0) === '#') a.setAttribute('href', PUBLIC_FAQ + href);
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
  });
  box.querySelectorAll('[style]').forEach(function (el) { el.removeAttribute('style'); });
  return box.innerHTML;
}

function snippet(text) {
  return text.length > 150 ? text.slice(0, 150).replace(/\s+\S*$/, '') + '…' : text;
}

function matchCard(m, isBest) {
  var f = m.faq;
  var card = document.createElement('div');
  card.className = 'match' + (isBest ? ' best open' : '');
  card.innerHTML =
    '<button type="button" class="match-head" aria-expanded="' + (isBest ? 'true' : 'false') + '">' +
      '<div class="match-where">' + esc(f.tabLabel) + (f.group ? ' › ' + esc(f.group) : '') +
        '<span class="match-score" title="How closely it matched">' + Math.round(m.score * 100) + '%</span></div>' +
      '<div class="match-q">' + esc(f.q) + '</div>' +
      '<div class="match-snip">' + esc(snippet(f.text)) + '</div>' +
    '</button>' +
    '<div class="match-body">' +
      '<div class="answer">' + answerHtml(f.a) + '</div>' +
      '<p class="match-foot"><a href="' + esc(PUBLIC_FAQ + '#' + f.tabId) + '" target="_blank" rel="noopener">' +
        'Open the ' + esc(f.tabLabel) + ' FAQ ↗</a></p>' +
    '</div>';
  card.querySelector('.match-head').addEventListener('click', function () {
    var open = card.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  return card;
}

function fallbackHtml() {
  return '<div class="fallback">Still not sure? Call Council on <strong>' + esc(Ask.phone) + '</strong>, ' +
    'or <a href="' + esc(Ask.requestUrl) + '" target="_blank" rel="noopener">lodge a request online</a>. ' +
    'You can also <a href="' + esc(PUBLIC_FAQ) + '" target="_blank" rel="noopener">browse the full FAQ</a>.</div>';
}

// Long answers would push the question off screen: show the question at the
// top, with the start of the reply under it.
function scrollToQuestion() {
  var msgs = document.querySelectorAll('.msg.user');
  var last = msgs[msgs.length - 1];
  if (last) $('chat').scrollTop = last.offsetTop - 12;
}

async function ask(question) {
  question = question.trim();
  if (!question) return;
  addMessage('user', esc(question));
  $('askInput').value = '';

  // Asked before the model has finished loading: say so, then answer.
  var waiting = null;
  if (!Ask.ready) {
    waiting = addMessage('bot', '<p>One moment — the language model is still loading on this device…</p>');
  }

  var results;
  try {
    results = await search(question, SHOW + SHOW_MORE);
  } catch (err) {
    if (waiting) waiting.parentNode.remove();
    addMessage('bot', '<p>Sorry — the finder couldn\'t start on this device.</p>' + fallbackHtml());
    scrollToQuestion();
    return;
  }
  if (waiting) waiting.parentNode.remove();

  var best = results[0];
  var shown = results.filter(function (r) { return r.score >= WEAK; });
  var bubble;

  if (!shown.length) {
    addMessage('bot',
      '<p>Sorry — I couldn\'t find a published answer that matches that.</p>' +
      '<p>Try asking it another way, or naming the topic (rates, bins, dogs, building…).</p>' + fallbackHtml());
    scrollToQuestion();
    return;
  }

  var lead = best.score >= STRONG
    ? 'This should answer it:'
    : 'I\'m not certain, but one of these might help:';
  bubble = addMessage('bot', '<p>' + lead + '</p>');

  shown.slice(0, SHOW).forEach(function (r, i) {
    bubble.appendChild(matchCard(r, i === 0 && best.score >= STRONG));
  });

  var extra = shown.slice(SHOW);
  if (extra.length) {
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'more';
    more.textContent = 'Show ' + extra.length + ' more';
    more.addEventListener('click', function () {
      extra.forEach(function (r) { bubble.insertBefore(matchCard(r, false), more); });
      more.remove();
    });
    bubble.appendChild(more);
  }

  bubble.insertAdjacentHTML('beforeend', fallbackHtml());
  scrollToQuestion();
}
Ask.ask = ask;

// ------------------------------------------------------------ start

function welcome() {
  var b = addMessage('bot',
    '<p><strong>Hi!</strong> Ask a question about Council services in your own words, and I\'ll find the ' +
    'answer in Council\'s published FAQ.</p>' +
    '<p>I can only point you to answers Council has already published — I don\'t make anything up.</p>' +
    '<div class="chips" id="chips"></div>');
  [
    'My neighbour\'s dog won\'t stop barking',
    'Can I live in a caravan while building?',
    'My bin wasn\'t picked up',
    'Why did my rates go up on my holiday house?',
    'There\'s a snake in my house'
  ].forEach(function (text) {
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip';
    c.textContent = text;
    c.addEventListener('click', function () { ask(text); });
    b.querySelector('#chips').appendChild(c);
  });
}

async function start() {
  setStatus('Checking you are signed in…');
  await Gate.require({
    lede: 'Ask is an experimental Process Hub tool for council staff. Sign in with your GitHub access token to open it.',
    opening: 'Signed in. Opening Ask…'
  });
  welcome();
  $('askInput').focus();
  var t0 = Date.now();
  try {
    setStatus('Loading the FAQ…');
    loadFingerprints();
    await loadFaqs();
    var todo = attachFingerprints();
    Ask.missing = { questions: todo.questions.length, passages: todo.passages.length };

    setStatus('Loading the language model (about 23 MB, first time only)…');
    startWorker();
    await send({ type: 'load', model: MODEL, base: new URL('.', location.href).href });

    // Questions without a fingerprint are needed before answering.
    await readMissing(todo.questions, 32, 'Reading new FAQ questions…', function (j, v) { j.faq.qVec = v; });
    Ask.ready = true;
    Ask.readySeconds = (Date.now() - t0) / 1000;
    markReady();

    // Passages without one only sharpen the matches, so they follow in the background.
    if (todo.passages.length) {
      await readMissing(todo.passages, 8, 'Ready · reading ' + todo.passages.length + ' new passages…',
        function (j, v) { j.faq.cVecs.push(v); });
    }
    if (todo.questions.length || todo.passages.length) saveExtra();
    Ask.complete = true;
    Ask.completeSeconds = (Date.now() - t0) / 1000;
    setStatus('Ready · ' + Ask.faqs.length + ' answers', 'ready');
  } catch (err) {
    console.error(err);
    markFailed(err);
    setStatus('Couldn\'t start: ' + err.message, 'error');
  }
}

$('askForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  ask($('askInput').value);
});

start();
</script>
