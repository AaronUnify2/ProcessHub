<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ask the FAQ — experimental</title>
<link rel="stylesheet" href="css/gate.css">
<meta name="theme-color" content="#16525e">
<style>
/* ===========================================================================
   faq-ask.html — the public FAQ page, with Ask in place of the search box.
   Experimental, for council staff: it opens only once the sign-in
   (js/gate.js) has confirmed a Process Hub token.

   The same page as FAQ.html, read from the same exports/FAQ.json. The box
   at the top takes a question in plain words and shows the published
   answers that match it best, in place of the tabs.

   Two modes. Browsing (the default): the page is the FAQ page, and Ask
   keeps to its box; the example questions and the model's progress show
   only while the box is in use. Asking (body.asking): the header shrinks,
   the box stays at the top of the screen so the next question is one tap
   away, the tabs fold into a "Browse all topics" button, and the answers
   get the space. Going back to browsing (that button, a topic link, Escape)
   folds the answer away into a "Back to your answer" link; the × in the box
   throws it away. The matching is
   ask.html's (js/ask-engine.js, with the model in js/ask-worker.js and the
   fingerprints read from ask.html). Until the model has loaded, the box
   matches words instead, and the answer updates once it is ready.
   It never writes an answer of its own: it only shows the published ones.

   Links into the page work as on FAQ.html:
     faq-ask.html#water                  opens the Water tab
     faq-ask.html#water/<question-slug>  opens that tab and that question
   "Copy link" copies the public FAQ page's link to the question, ready to
   send to a customer.
   =========================================================================== */

:root {
  --ink: #18222b;
  --ink-soft: #4a5862;
  --ink-faint: #6f7d86;
  --line: #dde3e6;
  --line-strong: #c4ced3;
  --paper: #ffffff;
  --wash: #f4f7f7;
  --accent: #16525e;
  --accent-strong: #0e3a43;
  --accent-wash: #e6f0f1;
  --note-wash: #eef4fb;
  --note-line: #3b6ea5;
  --warn-wash: #fff6e0;
  --warn-line: #c98a00;
  --term-wash: #edf6ee;
  --term-line: #3d7d47;
  --mark: #fff0a8;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 38, 46, 0.06), 0 2px 8px rgba(16, 38, 46, 0.05);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--wash);
}

a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-strong); }

:focus-visible { outline: 3px solid #5aa6b5; outline-offset: 2px; border-radius: 4px; }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--accent); color: #fff; padding: 8px 14px; z-index: 50;
}
.skip:focus { left: 8px; top: 8px; }

/* ---- header ------------------------------------------------------------ */

.masthead {
  background: var(--accent);
  color: #fff;
  padding: 28px 0 72px;
}
.masthead-inner { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.eyebrow {
  margin: 0 0 6px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.85;
}
.masthead h1 {
  margin: 0;
  font-size: clamp(1.75rem, 4.5vw, 2.6rem);
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.masthead p.lede { margin: 10px 0 0; max-width: 40em; opacity: 0.92; }

/* ---- search ------------------------------------------------------------ */

.shell { max-width: 920px; margin: -48px auto 0; padding: 0 16px 64px; }

.search {
  position: relative;
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: 0 4px 18px rgba(16, 38, 46, 0.12);
}
.search label {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
}
.search svg {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: var(--ink-faint); pointer-events: none;
}
.search input {
  width: 100%;
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  padding: 16px 48px 16px 46px;
  font: inherit;
  font-size: 1.05rem;
  color: var(--ink);
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
}
.search input:focus { outline: none; border-color: #5aa6b5; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: none; background: none; cursor: pointer;
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 1.3rem; line-height: 1; color: var(--ink-faint);
}
.search .clear:hover { background: var(--wash); color: var(--ink); }

/* Ask: the box takes a question and has its own button. */
.search form { display: flex; align-items: center; margin: 0; }
.search .field { position: relative; flex: 1; min-width: 0; }
.search input { padding-right: 44px; }
.search .ask-go {
  flex-shrink: 0;
  margin: 6px 6px 6px 0;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-weight: 600;
  padding: 10px 20px;
  cursor: pointer;
}
.search .ask-go:hover { background: var(--accent-strong); }
.ask-status { margin: 8px 2px 0; font-size: 0.82rem; color: var(--ink-faint); min-height: 1.2em; }
.ask-status.ready { color: #2e6b3a; }
.ask-status.error { color: #9b1c1c; }
.tag {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border-radius: 999px;
  background: #f2b632;
  color: #3a2a00;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  vertical-align: 1px;
}

/* ---- the two modes: browsing and asking ------------------------------- */

/* Browsing: Ask keeps to its box. Examples and progress show while it is in use. */
.try, .ask-status { display: none; }
body.ask-focus:not(.asking) .try { display: flex; }
body.ask-focus:not(.asking) .ask-status,
body.asking .ask-status:not(.ready) { display: block; }

.recall {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  margin: 10px 0 0; padding: 6px 14px;
  border: 1px solid var(--accent); border-radius: 999px;
  background: var(--accent-wash); color: var(--accent-strong);
  font: inherit; font-size: 0.88rem; cursor: pointer;
}
.recall span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recall:hover { background: var(--paper); }
.recall[hidden], body.asking .recall { display: none; }

.browse-bar { display: none; margin: 14px 0 16px; }
.browse-bar button {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line-strong); background: var(--paper); border-radius: 999px;
  padding: 7px 14px; font: inherit; font-size: 0.92rem; color: var(--ink); cursor: pointer;
}
.browse-bar button:hover { border-color: var(--accent); color: var(--accent); }
.browse-bar svg { width: 16px; height: 16px; }

/* Asking: a slimmer header, the box stays in reach, the answers get the room. */
body.asking .masthead { padding: 14px 0 14px; }
body.asking .masthead h1 { font-size: 1.25rem; }
body.asking .masthead .lede { display: none; }
body.asking .shell { margin-top: 0; }
body.asking .ask-area {
  position: sticky; top: 0; z-index: 20;
  margin: 0 -16px; padding: 12px 16px 10px;
  background: var(--wash);
  box-shadow: 0 6px 10px -8px rgba(16, 38, 46, 0.25);
}
body.asking .tabs { display: none; }
body.asking .browse-bar { display: block; }
body.asking #content .panel:not([hidden]) { animation: rise 0.18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { body.asking #content .panel:not([hidden]) { animation: none; } }

.try { flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 0.85rem; color: var(--ink-soft); }
.chip {
  border: 1px solid var(--line-strong);
  background: var(--paper);
  border-radius: 999px;
  padding: 4px 11px;
  font: inherit;
  font-size: 0.82rem;
  color: var(--ink);
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 640px) {
  .try { flex-wrap: nowrap; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 4px; scrollbar-width: none; }
  .try::-webkit-scrollbar { display: none; }
  .try span, .chip { white-space: nowrap; }
  .search .ask-go { padding: 10px 14px; }
}

/* ---- tabs -------------------------------------------------------------- */

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 20px 0 22px;
  padding: 0;
  list-style: none;
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 14px;
  font: inherit;
  font-size: 0.92rem;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { border-color: var(--accent); color: var(--accent); }
.tab[aria-selected="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.tab .new {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  background: #f2b632;
  color: #3a2a00;
  padding: 1px 6px;
  border-radius: 999px;
}

/* On a phone the tabs become one row that scrolls sideways. */
@media (max-width: 640px) {
  .tabs {
    flex-wrap: nowrap;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    margin: 16px -16px 18px;
    padding: 2px 16px 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { scroll-snap-align: start; }
}

/* ---- a tab's page ------------------------------------------------------ */

.panel[hidden] { display: none; }

.panel-head { margin: 0 0 14px; }
.panel-head h2 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
.panel-head .count { margin: 2px 0 0; color: var(--ink-faint); font-size: 0.9rem; }

.intro {
  background: var(--paper);
  border-radius: var(--radius);
  border-left: 4px solid var(--accent);
  box-shadow: var(--shadow);
  padding: 16px 20px;
  margin-bottom: 18px;
  color: var(--ink-soft);
}
.intro strong { color: var(--ink); }
.intro > :first-child { margin-top: 0; }
.intro > :last-child { margin-bottom: 0; }
.intro p { margin: 0 0 8px; }

/* A tab's steps, and the same markup where an answer uses it. */
.stepper {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
  margin: 0 0 20px;
  padding: 0;
  list-style: none;
  counter-reset: none;
}
.stepper .step {
  background: var(--paper);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.88rem;
  line-height: 1.4;
  color: var(--ink);
}
.stepper .step b {
  display: block;
  margin-bottom: 3px;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
@media (max-width: 640px) {
  .stepper { grid-template-columns: 1fr; gap: 0; border-left: 2px solid var(--line-strong); margin-left: 6px; padding-left: 0; }
  .stepper .step {
    position: relative; background: none; border: none; border-radius: 0;
    padding: 4px 0 10px 18px;
  }
  .stepper .step::before {
    content: ""; position: absolute; left: -7px; top: 8px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--paper); border: 3px solid var(--accent);
  }
}

.group {
  margin: 28px 0 10px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.list > .group:first-child { margin-top: 0; }

.list { margin: 0; padding: 0; list-style: none; }

/* ---- a question -------------------------------------------------------- */

.qa {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  scroll-margin-top: 12px;
}
.qa.open { border-color: var(--line-strong); }

.qa-q {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  margin: 0;
  padding: 16px 18px;
  border: none;
  background: none;
  font: inherit;
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.45;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
  border-radius: var(--radius);
}
.qa-q:hover { color: var(--accent); }
.qa-q .q-text { flex: 1; }
.qa-q .where {
  display: block;
  margin-top: 2px;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-faint);
}
.qa-q .chev {
  flex-shrink: 0;
  width: 26px; height: 26px;
  margin-top: -1px;
  border-radius: 50%;
  background: var(--accent-wash);
  color: var(--accent);
  display: grid; place-items: center;
  transition: transform 0.2s ease;
}
.qa-q .chev svg { width: 14px; height: 14px; }
.qa.open .qa-q .chev { transform: rotate(180deg); }

.qa-a {
  padding: 0 18px 18px;
  font-size: 0.96rem;
  line-height: 1.65;
  color: #26323b;
}
.qa-a[hidden] { display: none; }
.qa-a > .body { border-top: 1px solid var(--line); padding-top: 14px; }
.qa-a .body > :first-child { margin-top: 0; }
.qa-a .body > :last-child { margin-bottom: 0; }

.qa-tools {
  display: flex; justify-content: flex-end;
  margin-top: 14px;
}
.copy-link {
  border: 1px solid var(--line-strong);
  background: var(--paper);
  border-radius: 999px;
  padding: 4px 12px;
  font: inherit;
  font-size: 0.8rem;
  color: var(--ink-soft);
  cursor: pointer;
}
.copy-link:hover { color: var(--accent); border-color: var(--accent); }

/* Beside each email link, for a reader whose device has no email app set up. */
.copy-email {
  display: inline-block;
  vertical-align: baseline;
  margin-left: 6px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  border-radius: 999px;
  padding: 0 8px;
  font: inherit;
  font-size: 0.75rem;
  line-height: 1.6;
  color: var(--ink-soft);
  cursor: pointer;
}
.copy-email:hover, .copy-email:focus-visible { color: var(--accent); border-color: var(--accent); }

/* ---- answer content ---------------------------------------------------- */

.body p { margin: 0 0 10px; }
.body ul, .body ol { margin: 6px 0 12px; padding-left: 1.4em; }
.body li { margin-bottom: 5px; }
.body h4 { font-size: 1rem; }
.body strong, .body b { color: var(--ink); }
/* Sizes pasted in from other pages would make some paragraphs smaller than others. */
.body [style*="font-size"] { font-size: inherit !important; }

.body .note, .body .warn, .body .term {
  border-radius: 8px;
  border-left: 4px solid;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 0.93rem;
}
.body .note { background: var(--note-wash); border-left-color: var(--note-line); }
.body .warn { background: var(--warn-wash); border-left-color: var(--warn-line); }
.body .term { background: var(--term-wash); border-left-color: var(--term-line); }

.table-scroll {
  overflow-x: auto;
  margin: 10px 0 14px;
  -webkit-overflow-scrolling: touch;
}
.body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin: 0;
}
.body th, .body td {
  border: 1px solid var(--line-strong);
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
  line-height: 1.45;
}
.body thead th {
  background: var(--accent-wash);
  color: var(--accent-strong);
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.body .setback-table tbody td:first-child,
.body .facility-table tbody td:first-child { font-weight: 600; background: #f8fafa; }
@media (max-width: 640px) {
  .body table { min-width: 520px; }
}

/* ---- terms with a definition ------------------------------------------- */

abbr.faq-def {
  text-decoration: underline dotted;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
  text-decoration-color: var(--accent);
  cursor: help;
  border-radius: 3px;
}
abbr.faq-def:hover, abbr.faq-def[aria-expanded="true"] { background: var(--accent-wash); }

.def-tip {
  position: absolute;
  z-index: 40;
  max-width: min(320px, calc(100vw - 24px));
  background: var(--ink);
  color: #fff;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.86rem;
  line-height: 1.45;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
}
.def-tip[hidden] { display: none; }
.def-tip .def-term { display: block; font-weight: 700; margin-bottom: 2px; }

/* ---- search results ---------------------------------------------------- */

.results-head { margin: 0 0 12px; color: var(--ink-soft); }
.results-head strong { color: var(--ink); }
.results-lead { margin: 0 0 10px; font-weight: 600; }
.results-note {
  margin: 0 0 12px; padding: 8px 12px; border-radius: 8px;
  background: var(--note-wash); color: var(--ink-soft); font-size: 0.88rem;
}
.score {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px;
  background: var(--wash); color: var(--ink-faint); font-size: 0.72rem;
}
.qa.best { border-color: var(--accent); }
.qa-tools { gap: 8px; flex-wrap: wrap; }
.more {
  border: none; background: none; padding: 4px 0; margin: 2px 0 8px;
  font: inherit; font-size: 0.9rem; color: var(--accent); cursor: pointer;
}
.fallback {
  margin-top: 14px; padding: 14px 18px; border-radius: var(--radius);
  background: var(--term-wash); border-left: 4px solid var(--term-line); font-size: 0.93rem;
}
.fallback p { margin: 0; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty {
  background: var(--paper);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow);
  color: var(--ink-soft);
}
.empty p { margin: 0 0 6px; }

/* ---- foot of a tab ----------------------------------------------------- */

.panel-foot {
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--line-strong);
  font-size: 0.9rem;
  color: var(--ink-soft);
}
.panel-foot a { margin: 0 2px; }
.reviewed { margin: 10px 0 0; font-size: 0.82rem; color: var(--ink-faint); }

.status { padding: 24px 0; color: var(--ink-soft); }
.status.error { color: #9b1c1c; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--ink); color: #fff; border-radius: 999px;
  padding: 8px 16px; font-size: 0.88rem; z-index: 60;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
}
.toast[hidden] { display: none; }

/* ---- printing ---------------------------------------------------------- */

@media print {
  body { background: #fff; font-size: 11pt; }
  body.asking .ask-area { position: static; box-shadow: none; }
  .masthead { background: none; color: #000; padding: 0 0 8pt; }
  .shell { margin: 0; padding: 0; max-width: none; }
  .search, .try, .ask-status, .recall, .browse-bar, .tabs, .copy-link, .more, .copy-email, .skip, .def-tip, .toast, .qa-q .chev { display: none !important; }
  .qa { box-shadow: none; break-inside: avoid; border-color: #bbb; }
  .qa-a[hidden] { display: block !important; }
  .intro, .stepper .step, .empty { box-shadow: none; }
  a { color: #000; }
}

@media (prefers-reduced-motion: reduce) {
  .qa-q .chev { transition: none; }
}
</style>
</head>
<body class="gated">

<a class="skip" href="#content">Skip to the questions</a>

<header class="masthead">
  <div class="masthead-inner">
    <p class="eyebrow">Southern Downs Regional Council <span class="tag">Experimental</span></p>
    <h1>Frequently asked questions</h1>
    <p class="lede">Answers about building, planning, rates, water, waste, animals and more. Ask a question in your own words, or pick a topic.</p>
  </div>
</header>

<main class="shell">
  <div class="ask-area" id="askArea">
  <div class="search" role="search">
    <form id="askForm" autocomplete="off">
      <div class="field">
        <label for="q">Ask a question</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Ask a question" autocomplete="off" enterkeyhint="search">
        <button class="clear" type="button" id="clear" aria-label="Clear the question" hidden>×</button>
      </div>
      <button class="ask-go" type="submit">Ask</button>
    </form>
  </div>
  <button class="recall" type="button" id="recall" hidden>↩ <span>Back to your answer</span></button>
  <p class="ask-status" id="askStatus" role="status"></p>
  <div class="try" id="try"><span>Try:</span></div>
  </div>

  <div class="browse-bar"><button type="button" id="browse"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>Browse all topics</button></div>

  <ul class="tabs" id="tabs" role="tablist" aria-label="Topics"></ul>

  <div id="content" tabindex="-1">
    <p class="status" id="status">Loading the questions…</p>
    <noscript><p class="status error">This page needs JavaScript turned on to show the questions.</p></noscript>
  </div>
</main>

<div class="def-tip" id="defTip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/github.js"></script>
<script src="js/gate.js"></script>
<script src="js/ask-engine.js"></script>
<script>
(function () {
  'use strict';

  // Process Hub's Publish button writes this file beside the page.
  var DATA_URL = 'exports/FAQ.json';

  // "Copy link" gives the public page's link, ready to send to a customer.
  var PUBLIC_FAQ = 'https://aaronunify2.github.io/ProcessHub/FAQ.html';

  var data = null;
  var tabs = [];          // [{ id, label, plain, panel, button, items: [question] }]
  var questions = [];     // every question: { tab, itemIndex, slug, q, a, plainQ, plainA, node }
  var byPlace = {};       // 'tabId/itemIndex' -> question, to find what the engine matched
  var currentTab = null;
  var tabsEl = document.getElementById('tabs');
  var contentEl = document.getElementById('content');
  var searchEl = document.getElementById('q');
  var clearEl = document.getElementById('clear');
  var resultsEl = null;

  // ---- small helpers -------------------------------------------------------

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html != null) node.innerHTML = html;
    return node;
  }

  /** The text of a piece of HTML, without running anything in it. */
  var scratch = document.implementation.createHTMLDocument('');
  function plain(html) {
    var div = scratch.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function slugify(text) {
    return text.toLowerCase()
      .replace(/['’]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 70)
      .replace(/-+$/g, '');
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  var CHEVRON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';

  // ---- building the page ---------------------------------------------------

  function render(json) {
    data = json;
    var values = variableMap(json.variables || []);
    contentEl.innerHTML = '';

    (json.tabs || []).forEach(function (tab, index) {
      var entry = { id: tab.id, label: tab.label, plain: plain(tab.label), items: [] };
      entry.button = buildTabButton(tab, index);
      entry.panel = buildPanel(tab, entry, values);
      tabs.push(entry);
      tabsEl.appendChild(entry.button.parentNode);
      contentEl.appendChild(entry.panel);
    });

    resultsEl = el('section', 'panel');
    resultsEl.hidden = true;
    resultsEl.setAttribute('aria-live', 'polite');
    contentEl.appendChild(resultsEl);

    resolveVariables(contentEl, values);
    prepareContent(contentEl);

    if (!tabs.length) {
      contentEl.innerHTML = '<p class="status">There are no questions published yet.</p>';
      return;
    }
    if (!followHash(false)) showTab(tabs[0].id, false);
  }

  function buildTabButton(tab, index) {
    var li = el('li');
    li.setAttribute('role', 'presentation');
    var button = el('button', 'tab', tab.label + (tab['new'] ? ' <span class="new">NEW</span>' : ''));
    button.type = 'button';
    button.id = 'tab-' + tab.id;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-controls', 'panel-' + tab.id);
    button.setAttribute('aria-selected', 'false');
    button.tabIndex = index === 0 ? 0 : -1;
    button.addEventListener('click', function () {
      clearSearch();
      showTab(tab.id, true);
    });
    button.addEventListener('keydown', onTabKey);
    li.appendChild(button);
    return button;
  }

  function buildPanel(tab, entry, values) {
    var panel = el('section', 'panel');
    panel.id = 'panel-' + tab.id;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-' + tab.id);
    panel.hidden = true;

    var count = (tab.items || []).filter(function (i) { return i.type !== 'group'; }).length;
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', null, tab.label));
    head.appendChild(el('p', 'count', count + (count === 1 ? ' question' : ' questions')));
    panel.appendChild(head);

    if (tab.intro) panel.appendChild(el('div', 'intro body', tab.intro));

    if (tab.stepper && tab.stepper.length) {
      var steps = el('ol', 'stepper');
      tab.stepper.forEach(function (s) {
        steps.appendChild(el('li', 'step', '<b>' + s.label + '</b>' + s.text));
      });
      panel.appendChild(steps);
    }

    var list = el('ul', 'list');
    var used = {};
    var group = '';
    (tab.items || []).forEach(function (item, itemIndex) {
      if (item.type === 'group') {
        group = plain(item.title);
        var heading = el('li', 'group', item.title);
        heading.setAttribute('role', 'heading');
        heading.setAttribute('aria-level', '3');
        list.appendChild(heading);
        return;
      }
      var slug = slugify(plain(item.q)) || 'question';
      var unique = slug, n = 2;
      while (used[unique]) unique = slug + '-' + n++;
      used[unique] = true;

      var question = {
        tab: entry, itemIndex: itemIndex, slug: unique, q: item.q, a: item.a || '', group: group,
        plainQ: plain(item.q), plainA: plain(item.a)
      };
      byPlace[tab.id + '/' + itemIndex] = question;
      question.node = buildQuestion(question, false);
      entry.items.push(question);
      questions.push(question);
      list.appendChild(question.node);
    });
    panel.appendChild(list);

    if (tab.footer) panel.appendChild(el('div', 'panel-foot body', tab.footer));
    if (tab.lastReviewed) panel.appendChild(el('p', 'reviewed', 'Last reviewed: ' + escapeHtml(tab.lastReviewed)));
    return panel;
  }

  var nextId = 1;
  function buildQuestion(question, inResults, highlight) {
    var li = el('li', 'qa');
    var answerId = 'a' + nextId++;
    li.id = inResults ? '' : 'q-' + question.tab.id + '-' + question.slug;

    var button = el('button', 'qa-q');
    button.type = 'button';
    button.setAttribute('aria-expanded', 'false');
    button.setAttribute('aria-controls', answerId);
    var text = el('span', 'q-text', highlight ? highlight(question.q) : question.q);
    if (inResults) {
      text.appendChild(el('span', 'where', escapeHtml(question.tab.plain) +
        (question.group ? ' · ' + escapeHtml(question.group) : '')));
    }
    button.appendChild(text);
    button.appendChild(el('span', 'chev', CHEVRON));

    var answer = el('div', 'qa-a');
    answer.id = answerId;
    answer.hidden = true;
    answer.appendChild(el('div', 'body', question.a));
    var tools = el('div', 'qa-tools');
    if (inResults) {
      var inTab = el('button', 'copy-link', 'Show in the ' + escapeHtml(question.tab.plain) + ' tab');
      inTab.type = 'button';
      inTab.addEventListener('click', function () { openInTab(question); });
      tools.appendChild(inTab);
    }
    var copy = el('button', 'copy-link', 'Copy link to this question');
    copy.type = 'button';
    copy.addEventListener('click', function () { copyLink(question); });
    tools.appendChild(copy);
    answer.appendChild(tools);

    button.addEventListener('click', function () {
      var opening = button.getAttribute('aria-expanded') !== 'true';
      setOpen(li, opening);
      if (opening && !inResults) setHash(question.tab.id + '/' + question.slug);
      if (!opening && !inResults) setHash(question.tab.id);
    });

    li.appendChild(button);
    li.appendChild(answer);
    return li;
  }

  function setOpen(li, open) {
    li.classList.toggle('open', open);
    li.querySelector('.qa-q').setAttribute('aria-expanded', open ? 'true' : 'false');
    li.querySelector('.qa-a').hidden = !open;
    if (!open) hideDefinition();
  }

  // ---- variables and definitions -------------------------------------------

  function variableMap(list) {
    var map = {};
    list.forEach(function (v) { if (v && v.id != null) map[v.id] = v; });
    return map;
  }

  /**
   * Fill in values from the variables list: a <span data-var> gets its text,
   * a link with data-var-href its address, a link with data-var-mailto the
   * address it emails (keeping the subject and message written for it). Ids
   * not in the list keep the text
   * already in the answer. A value with a definition that the answer does not
   * already wrap gets one, so definitions show even in an older FAQ.json.
   */
  function resolveVariables(root, values) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-var]'), function (node) {
      var v = values[node.getAttribute('data-var')];
      if (!v) return;
      if (v.value != null) node.textContent = v.value;
      if (v.definition && !node.closest('abbr')) {
        var abbr = document.createElement('abbr');
        abbr.className = 'faq-def';
        abbr.title = v.definition;
        node.parentNode.insertBefore(abbr, node);
        abbr.appendChild(node);
      }
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-var-href]'), function (node) {
      var v = values[node.getAttribute('data-var-href')];
      if (v && v.value != null) node.setAttribute('href', v.value);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-var-mailto]'), function (node) {
      var v = values[node.getAttribute('data-var-mailto')];
      if (!v || !v.value) return;
      var href = node.getAttribute('href') || '';
      var query = href.indexOf('?') === -1 ? '' : href.slice(href.indexOf('?'));
      node.setAttribute('href', 'mailto:' + String(v.value).trim() + query);
    });
  }

  /** The address an email link sends to. */
  function mailtoAddress(href) {
    var address = String(href || '').replace(/^mailto:/i, '').split('?')[0];
    try { return decodeURIComponent(address); } catch (e) { return address; }
  }

  /** Definitions become tappable, wide tables scroll, outside links open apart. */
  function prepareContent(root) {
    Array.prototype.forEach.call(root.querySelectorAll('abbr.faq-def'), function (abbr) {
      // The page shows its own box, which also works on a phone; the browser's
      // own tooltip would show the same words a second time.
      if (abbr.title) {
        abbr.setAttribute('data-def', abbr.title);
        abbr.removeAttribute('title');
      }
      abbr.tabIndex = 0;
      abbr.setAttribute('role', 'button');
      abbr.setAttribute('aria-expanded', 'false');
      abbr.setAttribute('aria-label', abbr.textContent + ': ' + abbr.getAttribute('data-def'));
    });
    Array.prototype.forEach.call(root.querySelectorAll('.body table'), function (table) {
      if (table.parentNode.classList.contains('table-scroll')) return;
      var wrap = el('div', 'table-scroll');
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
    Array.prototype.forEach.call(root.querySelectorAll('.body a[target="_blank"]'), function (a) {
      a.setAttribute('rel', 'noopener');
    });
    // An email link opens the reader's email app. Where there is none set up
    // (a shared computer, webmail in a browser) the click does nothing, so
    // the address can be copied instead.
    Array.prototype.forEach.call(root.querySelectorAll('.body a[href^="mailto:"]'), function (a) {
      var next = a.nextElementSibling;
      if (next && next.classList.contains('copy-email')) return;
      var address = mailtoAddress(a.getAttribute('href'));
      if (!address) return;
      var copy = el('button', 'copy-email', 'Copy');
      copy.type = 'button';
      copy.setAttribute('aria-label', 'Copy the email address ' + address);
      copy.addEventListener('click', function () { copyText(address, 'Email address copied'); });
      a.parentNode.insertBefore(copy, a.nextSibling);
    });
  }

  var tipEl = document.getElementById('defTip');
  var tipFor = null;
  var hoverTimer = null;

  function showDefinition(abbr) {
    clearTimeout(hoverTimer);
    if (tipFor === abbr) return;
    hideDefinition();
    tipFor = abbr;
    tipEl.innerHTML = '<span class="def-term">' + escapeHtml(abbr.textContent) + '</span>' +
      escapeHtml(abbr.getAttribute('data-def'));
    tipEl.hidden = false;
    abbr.setAttribute('aria-expanded', 'true');
    abbr.setAttribute('aria-describedby', 'defTip');
    placeDefinition(abbr);
  }

  function placeDefinition(abbr) {
    var r = abbr.getBoundingClientRect();
    var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    var vw = document.documentElement.clientWidth;
    var left = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), vw - tw - 12);
    var top = r.bottom + 8;
    if (top + th > window.innerHeight - 8 && r.top - th - 8 > 0) top = r.top - th - 8;
    tipEl.style.left = (left + window.pageXOffset) + 'px';
    tipEl.style.top = (top + window.pageYOffset) + 'px';
  }

  function hideDefinition() {
    clearTimeout(hoverTimer);
    if (!tipFor) return;
    tipFor.setAttribute('aria-expanded', 'false');
    tipFor.removeAttribute('aria-describedby');
    tipFor = null;
    tipEl.hidden = true;
  }

  function defAt(target) {
    return target && target.closest ? target.closest('abbr.faq-def[data-def]') : null;
  }

  // Pressing a term focuses it, and focus shows its definition, so by the
  // time the click arrives the box is already open. Whether a tap opens or
  // closes it depends on what was open when the press began.
  var openAtPress = null;
  document.addEventListener('pointerdown', function () { openAtPress = tipFor; }, true);

  document.addEventListener('click', function (event) {
    var abbr = defAt(event.target);
    if (abbr) {
      var wasOpen = openAtPress === abbr;
      openAtPress = null;
      // A definition inside a link should not follow the link on first tap.
      if (abbr.closest('a') && !wasOpen) event.preventDefault();
      // With a mouse, hovering already shows it; a click keeps it showing.
      if (wasOpen && lastPointer !== 'mouse' && !abbr.closest('a')) hideDefinition();
      else showDefinition(abbr);
      return;
    }
    openAtPress = null;
    if (!tipEl.contains(event.target)) hideDefinition();
  });
  // A tap on a phone also sends a pretend hover just before its click. Hover
  // is for a mouse only, or the tap would open the box and close it again.
  var lastPointer = 'mouse';
  document.addEventListener('pointerdown', function (event) {
    lastPointer = event.pointerType || 'mouse';
  }, true);
  document.addEventListener('mouseover', function (event) {
    if (lastPointer === 'touch' || lastPointer === 'pen') return;
    var abbr = defAt(event.target);
    if (abbr) showDefinition(abbr);
  });
  document.addEventListener('pointermove', function (event) {
    if (event.pointerType === 'mouse') lastPointer = 'mouse';
  }, { passive: true });
  document.addEventListener('mouseout', function (event) {
    if (lastPointer === 'touch' || lastPointer === 'pen') return;
    var abbr = defAt(event.target);
    if (abbr && abbr === tipFor && !abbr.contains(event.relatedTarget)) {
      hoverTimer = setTimeout(hideDefinition, 150);
    }
  });
  document.addEventListener('focusin', function (event) {
    var abbr = defAt(event.target);
    if (abbr) showDefinition(abbr);
    else if (tipFor) hideDefinition();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') hideDefinition();
    var abbr = defAt(event.target);
    if (abbr && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      if (tipFor === abbr) hideDefinition(); else showDefinition(abbr);
    }
  });
  window.addEventListener('resize', hideDefinition);
  window.addEventListener('scroll', function () { if (tipFor) placeDefinition(tipFor); }, { passive: true });

  // ---- tabs ----------------------------------------------------------------

  function findTab(id) {
    for (var i = 0; i < tabs.length; i++) if (tabs[i].id === id) return tabs[i];
    return null;
  }

  function showTab(id, updateHash) {
    var tab = findTab(id) || tabs[0];
    currentTab = tab;
    resultsEl.hidden = true;
    tabs.forEach(function (t) {
      var on = t === tab;
      t.panel.hidden = !on;
      t.button.setAttribute('aria-selected', on ? 'true' : 'false');
      t.button.tabIndex = on ? 0 : -1;
    });
    hideDefinition();
    revealTabButton(tab.button);
    if (updateHash) setHash(tab.id);
    return tab;
  }

  /** On a phone the tab row scrolls; keep the chosen tab in view. */
  function revealTabButton(button) {
    var row = tabsEl;
    if (row.scrollWidth <= row.clientWidth) return;
    var li = button.parentNode;
    var left = li.offsetLeft - 16;
    var right = li.offsetLeft + li.offsetWidth - row.clientWidth + 16;
    if (row.scrollLeft > left) row.scrollLeft = left;
    else if (row.scrollLeft < right) row.scrollLeft = right;
  }

  function onTabKey(event) {
    var index = tabs.indexOf(currentTab);
    var next = null;
    if (event.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length];
    if (event.key === 'ArrowLeft') next = tabs[(index - 1 + tabs.length) % tabs.length];
    if (event.key === 'Home') next = tabs[0];
    if (event.key === 'End') next = tabs[tabs.length - 1];
    if (!next) return;
    event.preventDefault();
    clearSearch();
    showTab(next.id, true);
    next.button.focus();
  }

  // ---- links into the page -------------------------------------------------

  var settingHash = false;

  function setHash(value) {
    var hash = '#' + value;
    if (location.hash === hash) return;
    if (history.replaceState) {
      history.replaceState(null, '', hash);
    } else {
      settingHash = true;
      location.hash = hash;
    }
  }

  /** Open whatever #tab or #tab/question names. Returns false if it names nothing. */
  function followHash(scroll) {
    var raw = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
    if (!raw) return false;
    var parts = raw.split('/');
    var tab = findTab(parts[0]);
    if (!tab) return false;
    clearSearch();
    showTab(tab.id, false);
    if (parts[1]) {
      var match = tab.items.filter(function (q) { return q.slug === parts[1]; })[0];
      if (match) {
        setOpen(match.node, true);
        setTimeout(function () { match.node.scrollIntoView({ block: 'start' }); }, 0);
        return true;
      }
    }
    if (scroll) tabsEl.scrollIntoView({ block: 'start' });
    return true;
  }

  window.addEventListener('hashchange', function () {
    if (settingHash) { settingHash = false; return; }
    if (tabs.length) followHash(true);
  });

  function copyLink(question) {
    var url = PUBLIC_FAQ + '#' + question.tab.id + '/' + question.slug;
    copyText(url, 'Link to the public FAQ copied');
  }

  /** Copy to the clipboard and say so; if that fails, show the text instead. */
  function copyText(text, message) {
    var done = function () { toast(message); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, message); });
    } else {
      fallbackCopy(text, message);
    }
  }

  function fallbackCopy(text, message) {
    var input = el('textarea');
    input.value = text;
    input.setAttribute('readonly', '');
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    input.remove();
    toast(ok ? message : text);
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }

  // ---- asking --------------------------------------------------------------
  //
  // A question replaces the tabs with the published answers that match it,
  // and each new question replaces the last. Clearing the box brings the tabs
  // back. Until the language model has loaded, the box matches words, and
  // the answer is redone by meaning as soon as the model is ready.

  var SHOW = 3;        // matches shown at first
  var SHOW_MORE = 3;   // more behind "Show more"
  var askStatusEl = document.getElementById('askStatus');
  var askSeq = 0;      // each question gets a number; a slower, older answer is dropped

  var engine = AskEngine.create({
    onStatus: function (text, state) {
      askStatusEl.textContent = text;
      askStatusEl.className = 'ask-status' + (state ? ' ' + state : '');
    }
  });
  window.AskPage = { engine: engine };   // for testing in a console

  document.getElementById('askForm').addEventListener('submit', function (event) {
    event.preventDefault();
    ask(searchEl.value);
  });
  searchEl.addEventListener('input', function () {
    // Emptying the box to type the next question keeps the answer showing.
    clearEl.hidden = !searchEl.value;
  });
  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') backToTabs();
  });
  clearEl.addEventListener('click', function () {
    discardAnswer();
    searchEl.focus();
  });

  // The box is "in use" while focus is anywhere in the ask area.
  var askArea = document.getElementById('askArea');
  askArea.addEventListener('focusin', function () { document.body.classList.add('ask-focus'); });
  askArea.addEventListener('focusout', function (event) {
    if (!askArea.contains(event.relatedTarget)) document.body.classList.remove('ask-focus');
  });

  var recallEl = document.getElementById('recall');
  var lastQuestion = '';   // the question whose answer is on screen, or folded away

  document.getElementById('browse').addEventListener('click', backToTabs);
  recallEl.addEventListener('click', function () {
    searchEl.value = lastQuestion;
    clearEl.hidden = false;
    showAnswerArea();
  });

  /** Asking: hide the tabs' pages, show the answer, give it the room. */
  function showAnswerArea() {
    tabs.forEach(function (t) {
      t.panel.hidden = true;
      t.button.setAttribute('aria-selected', 'false');
    });
    hideDefinition();
    document.body.classList.add('asking');
    resultsEl.hidden = false;
    window.scrollTo(0, 0);
  }

  /** Back to browsing, keeping the answer behind "Back to your answer". */
  function backToTabs() {
    clearSearch();
    showTab(currentTab ? currentTab.id : tabs[0].id, false);
    tabsEl.scrollIntoView({ block: 'nearest' });
  }

  /** The × in the box: throw the answer away, and browse. */
  function discardAnswer() {
    askSeq++;
    lastQuestion = '';
    resultsEl.innerHTML = '';
    backToTabs();
  }

  // Leaving the answer for a topic: fold it away (every way into a tab calls this).
  function clearSearch() {
    if (!resultsEl) return;
    document.body.classList.remove('asking');
    resultsEl.hidden = true;
    searchEl.value = '';
    clearEl.hidden = true;
    recallEl.hidden = !(lastQuestion && resultsEl.childNodes.length);
    recallEl.querySelector('span').textContent = 'Back to your answer: “' + lastQuestion + '”';
  }

  /** "Show in the … tab": leave the answers and open the question where it lives. */
  function openInTab(question) {
    clearSearch();
    showTab(question.tab.id, false);
    setOpen(question.node, true);
    setHash(question.tab.id + '/' + question.slug);
    question.node.scrollIntoView({ block: 'start' });
  }

  var EXAMPLES = [
    'My neighbour\'s dog won\'t stop barking',
    'Can I live in a caravan while building?',
    'My bin wasn\'t picked up',
    'Why did my rates go up on my holiday house?',
    'There\'s a snake in my house'
  ];

  function addChips() {
    var row = document.getElementById('try');
    EXAMPLES.forEach(function (text) {
      var chip = el('button', 'chip');
      chip.type = 'button';
      chip.textContent = text;
      // Keep the focus in the box, so the examples do not fold away mid-tap.
      chip.addEventListener('mousedown', function (event) { event.preventDefault(); });
      chip.addEventListener('click', function () {
        searchEl.value = text;
        ask(text);
      });
      row.appendChild(chip);
    });
  }

  function ask(question) {
    question = question.trim();
    if (!question || !tabs.length) return;
    var seq = ++askSeq;
    lastQuestion = question;
    clearEl.hidden = false;
    searchEl.blur();   // on a phone, put the keyboard away so the answer shows

    if (engine.ready) { askByMeaning(question, seq); return; }
    showWordMatches(question, !engine.failed);
    if (!engine.failed) {
      engine.whenReady.then(function () {
        if (seq === askSeq) askByMeaning(question, seq);
      }, function () { /* stays on the word matches */ });
    }
  }

  function askByMeaning(question, seq) {
    engine.search(question, SHOW + SHOW_MORE).then(function (results) {
      if (seq !== askSeq) return;
      var shown = results
        .filter(function (r) { return r.score >= AskEngine.WEAK; })
        .map(function (r) { return { q: byPlace[r.faq.tabId + '/' + r.faq.itemIndex], score: r.score }; })
        .filter(function (r) { return r.q; });
      var strong = shown.length && shown[0].score >= AskEngine.STRONG;
      showMatches(question, shown, {
        lead: strong ? 'This should answer it:' : 'We\'re not certain, but one of these might help:',
        openFirst: strong
      });
    }, function () {
      if (seq === askSeq) showWordMatches(question, false);
    });
  }

  /** While the model loads (or if it cannot): the questions that share the most words. */
  function showWordMatches(question, updating) {
    var asked = AskEngine.terms(question);
    var keys = Object.keys(asked);
    var scored = [];
    questions.forEach(function (q, order) {
      if (!q.terms) { q.qWords = AskEngine.terms(q.plainQ); q.terms = AskEngine.terms(q.plainA); }
      var score = 0;
      keys.forEach(function (t) { score += (q.qWords[t] ? 3 : 0) + (q.terms[t] ? 1 : 0); });
      if (score) scored.push({ q: q, score: score, order: order });
    });
    scored.sort(function (a, b) { return b.score - a.score || a.order - b.order; });
    showMatches(question, scored.slice(0, SHOW + SHOW_MORE).map(function (s) { return { q: s.q }; }), {
      lead: 'Questions that use the same words:',
      note: updating
        ? 'The language model is still loading on this device. These are word matches for now; ' +
          'the answer will update by itself in a moment.'
        : '',
      openFirst: false
    });
  }

  function showMatches(question, matches, opts) {
    // An answer redone by meaning while it is folded away stays folded.
    var folded = !document.body.classList.contains('asking') && question !== searchEl.value.trim();
    resultsEl.innerHTML = '';
    resultsEl.appendChild(el('p', 'results-head', 'You asked: <strong>“' + escapeHtml(question) + '”</strong>'));
    if (opts.note) resultsEl.appendChild(el('p', 'results-note', escapeHtml(opts.note)));

    if (!matches.length) {
      resultsEl.appendChild(el('div', 'empty',
        '<p><strong>Sorry, we could not find a published answer that matches that.</strong></p>' +
        '<p>Try asking it another way, or naming the topic (rates, bins, dogs, building), or pick a topic above.</p>'));
    } else {
      resultsEl.appendChild(el('p', 'results-lead', escapeHtml(opts.lead)));
      var list = el('ul', 'list');
      var cards = matches.map(function (m, i) {
        var node = buildQuestion(m.q, true);
        if (m.score != null) {
          node.querySelector('.where').appendChild(el('span', 'score', Math.round(m.score * 100) + '%'));
          node.querySelector('.score').title = 'How closely it matched';
        }
        if (i === 0 && opts.openFirst) { node.classList.add('best'); setOpen(node, true); }
        return node;
      });
      cards.slice(0, SHOW).forEach(function (node) { list.appendChild(node); });
      resultsEl.appendChild(list);
      var extra = cards.slice(SHOW);
      if (extra.length) {
        var more = el('button', 'more', 'Show ' + extra.length + ' more');
        more.type = 'button';
        more.addEventListener('click', function () {
          extra.forEach(function (node) { list.appendChild(node); });
          more.remove();
        });
        resultsEl.appendChild(more);
      }
    }
    resultsEl.appendChild(el('div', 'fallback',
      '<p>Still not sure? Call us on ' + councilPhone() + ', or ' + requestLink() + '.</p>'));
    resolveVariables(resultsEl, variableMap(data.variables || []));
    prepareContent(resultsEl);
    if (!folded) showAnswerArea();
  }

  /** Council's main number, from the variables list when it is loaded. */
  function councilPhone() {
    var v = data && variableMap(data.variables || [])['phone_1300_697_372'];
    var number = (v && v.value) || '1300 697 372';
    return '<a href="tel:' + number.replace(/[^0-9+]/g, '') + '">' + escapeHtml(number) + '</a>';
  }

  /** The online request system, from the variables list when it is loaded. */
  function requestLink() {
    var v = data && variableMap(data.variables || [])['url_crm_sdrc_qld_gov_au'];
    var url = (v && v.value) || 'https://crm.sdrc.qld.gov.au/webinput/customform/categorylist?show_tiles=y';
    return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">lodge a request online</a>';
  }

  // ---- loading -------------------------------------------------------------

  Gate.require({
    lede: 'Ask the FAQ is an experimental Process Hub tool for council staff. Sign in with your GitHub access token to open it.',
    opening: 'Signed in. Opening Ask the FAQ…'
  }).then(function () {
    return fetch(DATA_URL, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }).then(function (json) {
    render(json);
    addChips();
    engine.start(json);
  }).catch(function (err) {
    var status = document.getElementById('status') || contentEl.appendChild(el('p', 'status'));
    status.className = 'status error';
    status.innerHTML = 'The questions could not be loaded just now. Try again in a moment, ' +
      'or call Council on ' + councilPhone() + '.';
    console.error('Could not load ' + DATA_URL + ':', err);
  });
})();
</script>
</body>
</html>
