<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live call — Process Hub</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/live.css">
</head>
<body class="live">

<header class="live-header">
  <button class="picker-toggle" id="pickerToggle" aria-label="Show or hide the process list">☰</button>
  <a class="live-brand" href="index.html" title="Back to Process Hub">Process&nbsp;Hub</a>
  <span class="live-tag">Live call</span>
  <span class="live-process" id="processName"></span>
  <span class="live-step" id="stepCount"></span>
  <span class="live-status loading" id="liveStatus">Loading…</span>
  <button class="lbtn" id="newCall" title="Start a new call">✦&nbsp;<span class="lbtn-text">New call</span></button>
  <button class="lbtn primary" id="liveExport" title="Export the data files">⤓&nbsp;<span class="lbtn-text">Export</span></button>
</header>

<div class="live-body">
  <aside class="picker" id="picker">
    <div class="picker-search">
      <input type="search" id="liveSearch" placeholder="Search processes…"
             autocomplete="off" spellcheck="false" aria-label="Search processes">
      <kbd>/</kbd>
    </div>
    <div class="picker-body" id="pickerBody"></div>
  </aside>

  <main class="run" id="run"></main>
</div>

<div class="flash" id="flash" hidden></div>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/edit.js"></script>
<script src="js/rules.js"></script>
<script src="js/export.js"></script>
<script src="js/live.js"></script>
<script>Live.init();</script>
</body>
</html>
