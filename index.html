<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Hub</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-header">
  <button class="drawer-toggle" id="drawerToggle" aria-label="Show or hide the tree">☰</button>
  <a class="app-brand" href="#/">Process&nbsp;Hub</a>
  <span class="pill-status loading" id="statusPill">Loading…</span>
  <a class="btn" href="live.html" title="Open the live call view">☎&nbsp;<span class="btn-text">Live call</span></a>
  <div class="export-wrap">
    <button class="btn primary" id="exportBtn">⤓&nbsp;<span class="btn-text">Export</span></button>
    <div class="export-menu" id="exportMenu" hidden>
      <button data-export="github">
        <strong>Export for GitHub</strong>
        <span>Four files → processhub/data/ and processhub/exports/</span>
      </button>
      <button data-export="faq">
        <strong>FAQ.json only</strong>
        <span>→ processhub/exports/FAQ.json — what FAQ.html reads</span>
      </button>
      <button data-export="verification">
        <strong>Verification sheet</strong>
        <span>Every variable, grouped by owning department</span>
      </button>
      <button data-export="issues">
        <strong>Issues report</strong>
        <span>The register as a readable page</span>
      </button>
      <button data-export="coverage">
        <strong>Coverage report</strong>
        <span>Status by department, handoffs and open issues</span>
      </button>
      <button data-export="discard" class="danger">
        <strong>Discard local changes</strong>
        <span>Reload the published content</span>
      </button>
    </div>
  </div>
</header>

<div class="conflict-bar" id="conflictBar" hidden></div>

<div class="app-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <input type="search" id="sidebarSearch" placeholder="Search everything…"
             autocomplete="off" spellcheck="false" aria-label="Search">
      <kbd class="search-hint">/</kbd>
    </div>
    <div class="sidebar-count" id="sidebarCount">—</div>
    <nav class="sidebar-body">
      <div id="tree"></div>
      <div id="searchResults" hidden></div>
    </nav>
  </aside>

  <main class="detail" id="detail"></main>
</div>

<!-- Variable picker, opened from the toolbar of any field being edited -->
<div class="modal" id="varPicker" hidden>
  <div class="modal-box">
    <h3>Insert a variable</h3>
    <p class="modal-sub">Pick a value to reference. It stays in step with the variable.</p>
    <input type="search" id="varPickerSearch" placeholder="Search by value or question…"
           autocomplete="off">
    <div class="pick-list" id="varPickerList"></div>
    <div class="modal-actions">
      <button class="btn" id="varPickerClose">Close</button>
    </div>
  </div>
</div>

<!-- Link builder, with the option to point at a URL variable -->
<div class="modal" id="linkModal" hidden>
  <div class="modal-box">
    <h3>Insert link</h3>
    <div class="fm-field">
      <label>Link text</label>
      <input type="text" id="lmText" placeholder="Text to show">
    </div>
    <div class="fm-field">
      <label>Address</label>
      <div class="lm-choice">
        <label><input type="radio" name="lmMode" value="url" checked> Type a URL</label>
        <label><input type="radio" name="lmMode" value="var"> Use a URL variable</label>
      </div>
      <input type="text" id="lmUrl" placeholder="https://…">
      <select id="lmVar"></select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="lmCancel">Cancel</button>
      <button class="btn primary" id="lmInsert">Insert link</button>
    </div>
  </div>
</div>

<!-- Raising an issue by hand -->
<div class="modal" id="issueModal" hidden>
  <div class="modal-box">
    <h3>Raise an issue</h3>
    <p class="modal-sub" id="imProcess"></p>
    <div class="fm-field">
      <label for="imNote">What is wrong or missing?</label>
      <textarea id="imNote" rows="3"></textarea>
    </div>
    <div class="fm-row">
      <div class="fm-field">
        <label for="imSeverity">Severity</label>
        <select id="imSeverity">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="fm-field">
        <label for="imBy">Raised by</label>
        <input type="text" id="imBy" placeholder="Your name or team">
      </div>
    </div>
    <div class="fm-field">
      <label for="imStep">About</label>
      <select id="imStep"></select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="imCancel">Cancel</button>
      <button class="btn primary" id="imSave">Raise issue</button>
    </div>
  </div>
</div>

<!-- Attaching an article or FAQ answer to a step or process -->
<div class="modal" id="attachModal" hidden>
  <div class="modal-box">
    <h3>Attach</h3>
    <p class="modal-sub" id="amWhere"></p>
    <div class="am-tabs">
      <button class="am-tab" data-kind="article">📖 Knowledge base</button>
      <button class="am-tab" data-kind="faq">❓ FAQ answers</button>
    </div>
    <input type="search" id="amSearch" placeholder="Search, or pick a suggestion below…"
           autocomplete="off">
    <div class="pick-list" id="amList"></div>
    <div class="modal-actions">
      <button class="btn" id="amClose">Close</button>
    </div>
  </div>
</div>

<!-- Merging a draft with published files that moved on -->
<div class="modal" id="mergeModal" hidden>
  <div class="modal-box wide">
    <h3>Review and merge</h3>
    <p class="modal-sub">Item by item: a change made on one side only is taken
      automatically; a change made on both sides is yours to choose.</p>
    <div class="merge-body" id="mergeBody"></div>
    <div class="modal-actions">
      <button class="btn" id="mergeCancel">Cancel</button>
      <button class="btn primary" id="mergeApply">Merge</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/merge.js"></script>
<script src="js/edit.js"></script>
<script src="js/rules.js"></script>
<script src="js/export.js"></script>
<script src="js/richtext.js"></script>
<script src="js/canvas.js"></script>
<script src="js/ui-sidebar.js"></script>
<script src="js/ui-detail.js"></script>
<script src="js/app.js"></script>
</body>
</html>
