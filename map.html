<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Meaning map — experimental</title>
<link rel="stylesheet" href="css/gate.css">
<link rel="stylesheet" href="css/meaning-map.css">
<style>
/* ===========================================================================
   Meaning map — an experiment, for council staff (behind the sign-in).
   Lays the published FAQ out on a page by what each answer means, as the
   small language model behind ask.html (all-MiniLM-L6-v2) reads it. Answers
   the model thinks are about the same thing sit close together, whatever tab
   they are on. The map itself is js/meaning-map.js, shared with the Probe
   section of Process Hub. It reads exports/FAQ.json, the fingerprints
   ask.html carries, and the model in vendor/. Tapping empty space asks
   "what would go here?" (js/spot-hint.js) — an experiment in wording.
   =========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --text: #1D1D1F;
  --text-soft: #6E6E73;
  --border: rgba(0, 0, 0, 0.09);
  --border-strong: rgba(0, 0, 0, 0.18);
  --accent: #0A66C2;
  --accent-soft: #EAF2FB;
  --warn: #B45309;
  --warn-soft: #FEF6E7;
  --good: #2E7D53;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

a { color: var(--accent); }
button, select, input { font: inherit; }

/* ---- Header ---- */

.map-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.map-brand { font-weight: 700; color: var(--text); text-decoration: none; }
.map-tag {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--warn);
  background: var(--warn-soft);
  padding: 2px 8px;
  border-radius: 10px;
}
.map-status {
  margin-left: auto;
  font-size: 0.82rem;
  color: var(--text-soft);
  text-align: right;
}
.map-status.ready { color: var(--good); }
.map-status.error { color: #C0392B; }

/* ---- Toolbar ---- */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.toolbar form { display: flex; gap: 6px; flex: 1 1 280px; min-width: 0; }
.toolbar input[type="search"] {
  flex: 1;
  min-width: 0;
  padding: 6px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface);
}
.toolbar label { font-size: 0.85rem; color: var(--text-soft); display: flex; align-items: center; gap: 6px; }
.toolbar select {
  padding: 5px 8px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
}
.btn {
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { color: #fff; opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* ---- Map and side panel ---- */

.main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; min-width: 0; position: relative; }
.stage .mmap { position: absolute; inset: 0; }

.panel {
  width: 360px;
  flex-shrink: 0;
  overflow-y: auto;
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 14px 16px 24px;
}
.panel h2 { font-size: 1.02rem; line-height: 1.35; margin-bottom: 4px; }
.panel h3 {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-soft);
  margin: 18px 0 6px;
}
.panel p { margin-bottom: 8px; }
.panel .soft { color: var(--text-soft); font-size: 0.88rem; }
.crumb { font-size: 0.8rem; color: var(--text-soft); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.crumb i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.answer {
  font-size: 0.9rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  max-height: 280px;
  overflow-y: auto;
  background: #FBFCFD;
}
.answer p, .answer ul, .answer ol, .answer table, .answer div { margin-bottom: 8px; }
.answer ul, .answer ol { padding-left: 20px; }
.answer table { border-collapse: collapse; font-size: 0.85rem; }
.answer td, .answer th { border: 1px solid var(--border); padding: 3px 6px; text-align: left; }
.answer .note, .answer .warn { padding: 6px 10px; border-radius: 6px; background: var(--accent-soft); }
.answer .warn { background: var(--warn-soft); }

.list { list-style: none; }
.list li { margin-bottom: 2px; }
.list button {
  width: 100%;
  text-align: left;
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--text);
  cursor: pointer;
  font-size: 0.88rem;
  line-height: 1.35;
}
.list button:hover { background: var(--accent-soft); }
.list i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; transform: translateY(-1px); }
.list .q { flex: 1; }
.list .score { font-variant-numeric: tabular-nums; color: var(--text-soft); font-size: 0.8rem; white-space: nowrap; }
.list .other { display: block; color: var(--warn); font-size: 0.76rem; }
.list .other.plain { color: var(--text-soft); }
.pair { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; }
.hints { list-style: none; }
.hints li { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: #FBFCFD; }
.hints button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
}
.hints button:hover { color: var(--accent); }
.hints small { display: block; color: var(--text-soft); font-size: 0.78rem; margin-top: 2px; }
.pair:last-child { border-bottom: 0; }

@media (max-width: 760px) {
  .main { flex-direction: column; }
  .stage { flex: none; height: 58vh; height: 58dvh; }
  .panel { width: auto; border-left: 0; border-top: 1px solid var(--border); flex: 1; }
  .map-status { font-size: 0.75rem; }
}
</style>
</head>
<body class="gated">

<header class="map-header">
  <a class="map-brand" href="index.html" title="Process Hub">Meaning map</a>
  <span class="map-tag">Experimental</span>
  <span class="map-status" id="status">Starting…</span>
</header>

<div class="toolbar">
  <form id="searchForm" autocomplete="off">
    <input type="search" id="searchInput" placeholder="Drop a question onto the map, e.g. can I keep chickens in town?" aria-label="A question to place on the map">
    <button class="btn primary" type="submit" id="searchBtn">Place</button>
  </form>
  <label>Read
    <select id="modeSelect">
      <option value="whole">Whole answers</option>
      <option value="question">Questions only</option>
    </select>
  </label>
  <label>Colour by
    <select id="colourSelect">
      <option value="tab">Tab</option>
      <option value="cluster">Meaning group</option>
    </select>
  </label>
  <button class="btn" type="button" id="reshuffle" title="Lay the map out again from a different start">Re-run layout</button>
</div>

<div class="main">
  <div class="stage" id="stage"></div>
  <aside class="panel" id="panel"></aside>
</div>

<!-- The model runs in a background worker, as in ask.html, from the copies in
     vendor/. It is only needed for a question typed into the box, and for any
     FAQ text published since ask.html's fingerprints were made. -->
<script type="text/plain" id="workerSource">
var extractor = null;

self.onmessage = async function (ev) {
  var msg = ev.data;
  try {
    if (msg.type === 'load') {
      var lib = await import(msg.base + 'vendor/transformers-3.0.2/transformers.min.js');
      lib.env.allowRemoteModels = false;
      lib.env.allowLocalModels = true;
      lib.env.localModelPath = msg.base + 'vendor/models/';
      lib.env.backends.onnx.wasm.wasmPaths = msg.base + 'vendor/transformers-3.0.2/';
      extractor = await lib.pipeline('feature-extraction', msg.model, {
        dtype: 'q8',
        progress_callback: function (p) {
          self.postMessage({ type: 'progress', file: p.file || '', status: p.status, progress: p.progress || 0 });
        }
      });
      self.postMessage({ id: msg.id, ok: true });
    } else if (msg.type === 'embed') {
      var out = await extractor(msg.texts, { pooling: 'mean', normalize: true });
      self.postMessage({ id: msg.id, ok: true, data: out.data, dims: out.dims });
    }
  } catch (err) {
    self.postMessage({ id: msg.id, ok: false, error: String((err && err.message) || err) });
  }
};
</script>

<script src="js/github.js"></script>
<script src="js/gate.js"></script>
<script src="js/meaning-map.js"></script>
<script src="js/spot-hint.js"></script>
<script>
var MODEL = 'Xenova/all-MiniLM-L6-v2';
var FAQ_URL = 'exports/FAQ.json';
var PUBLIC_FAQ = 'https://aaronunify2.github.io/ProcessHub/FAQ.html';
var EXTRA_KEY = 'processhub.map.extra';   // fingerprints this browser worked out itself

var NEIGHBOURS = 6;          // shown for a chosen answer
var DUPLICATE = 0.86;        // pairs at least this alike are listed as possible overlaps
var SPOT_LINES = 5;          // lines from a picked spot to the answers it is read from
var EMPTY = 4;               // a spot this many typical gaps from any dot is empty ground

var M = {
  faqs: [],         // { i, tab, tabId, tabLabel, group, q, a, text, chunks, qKey, cKeys, qVec, cVecs, vec, words }
  tabs: [],         // { id, label, colour, count }
  groups: null,     // { list: [{ members, label, colour }], of: Int32Array }
  sim: null,        // n × n similarities
  layout: null,
  stop: null,       // stops the layout while it is running
  baked: {},        // key -> packed fingerprint, from ask.html
  extra: {},        // key -> packed fingerprint, worked out in this browser
  worker: null,
  modelReady: null,
  mode: 'whole',
  colourBy: 'tab',
  selected: -1,
  neighbours: [],
  focusKey: null,   // a legend chip picked: a tab id, or 'c' + group number
  probe: null,      // { text, x, y, matches: [{ i, s }] }
  pendingProbe: null,
  spot: null,       // a spot picked on empty space: { x, y, reading, hints, failed, run }
  spotRun: 0,
  seed: 1
};
window.MeaningMapPage = M;   // for poking at in a console

var $ = function (id) { return document.getElementById(id); };

// ---------------------------------------------------------------- utilities

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// HTML to plain text, using the browser's own parser — as ask.html does.
function plain(html) {
  var doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  doc.querySelectorAll('td, th, li, p, div, br').forEach(function (el) {
    el.insertAdjacentText('afterend', ' ');
  });
  return doc.body.textContent.replace(/\s+/g, ' ').trim();
}

// The same hash ask.html keys its fingerprints by.
function hash(str) {
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (var i = 0; i < str.length; i++) {
    var ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

function setStatus(text, cls) {
  var el = $('status');
  el.textContent = text;
  el.className = 'map-status' + (cls ? ' ' + cls : '');
}

function readyStatus() {
  setStatus('Ready · ' + M.faqs.length + ' answers · ' + M.groups.list.length + ' meaning groups', 'ready');
}

// Fingerprints are packed as in ask.html: one byte per number, base64.
function pack(vec) {
  var max = 0;
  for (var i = 0; i < vec.length; i++) max = Math.max(max, Math.abs(vec[i]));
  var bytes = new Int8Array(vec.length);
  for (var j = 0; j < vec.length; j++) bytes[j] = Math.round(vec[j] / (max || 1) * 127);
  var s = '';
  var u = new Uint8Array(bytes.buffer);
  for (var k = 0; k < u.length; k++) s += String.fromCharCode(u[k]);
  return btoa(s);
}
function unpack(b64) {
  var s = atob(b64);
  var vec = new Float32Array(s.length);
  for (var i = 0; i < s.length; i++) {
    var b = s.charCodeAt(i);
    vec[i] = b > 127 ? b - 256 : b;
  }
  return MeaningMap.normalise(vec);
}

// ------------------------------------------------------------ loading

// Long answers are read in short passages — exactly as ask.html cuts them, so
// its fingerprints line up with the text here.
function chunk(text) {
  var sentences = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
  var out = [], cur = '';
  sentences.forEach(function (s) {
    if (cur && (cur + s).length > 380) { out.push(cur.trim()); cur = ''; }
    cur += s;
  });
  if (cur.trim()) out.push(cur.trim());
  return out.slice(0, 16);
}
function questionText(f) {
  return f.tabLabel + (f.group ? ' — ' + f.group : '') + ': ' + f.q;
}
function chunkText(f, c) {
  return f.q + ' ' + c;
}

async function loadFaqs() {
  var res = await fetch(FAQ_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error('Could not load the FAQ (' + res.status + ')');
  var data = await res.json();
  var faqs = [], tabs = [];
  (data.tabs || []).forEach(function (tab) {
    var group = '';
    var t = { id: tab.id, label: plain(tab.label), colour: MeaningMap.PALETTE[tabs.length % MeaningMap.PALETTE.length], count: 0 };
    tabs.push(t);
    (tab.items || []).forEach(function (item) {
      if (item.type === 'group') { group = plain(item.title); return; }
      if (item.type !== 'faq') return;
      var text = plain(item.a);
      var f = {
        i: faqs.length,
        tab: t,
        tabId: tab.id,
        tabLabel: t.label,
        group: group,
        q: plain(item.q),
        a: item.a,
        text: text,
        chunks: chunk(text)
      };
      f.qKey = hash(questionText(f));
      f.cKeys = f.chunks.map(function (c) { return hash(chunkText(f, c)); });
      f.words = MeaningMap.words(f.q + ' ' + f.q + ' ' + group + ' ' + text.slice(0, 300));
      t.count++;
      faqs.push(f);
    });
  });
  M.faqs = faqs;
  M.tabs = tabs.filter(function (t) { return t.count; });
}

async function loadFingerprints() {
  try {
    var res = await fetch('ask.html', { cache: 'no-cache' });
    var html = res.ok ? await res.text() : '';
    var m = html.match(/<script type="application\/json" id="fingerprints">([\s\S]*?)<\/script>/);
    if (m) {
      var block = JSON.parse(m[1]);
      if (block.model === MODEL && block.items) M.baked = block.items;
    }
  } catch (err) {
    console.warn('Fingerprints from ask.html unavailable:', err);
  }
  try {
    var saved = JSON.parse(localStorage.getItem(EXTRA_KEY) || 'null');
    if (saved && saved.model === MODEL && saved.items) M.extra = saved.items;
  } catch (err) { /* private window or blocked storage: work them out again */ }
}

function lookup(key) {
  var p = M.baked[key] || M.extra[key];
  return p ? unpack(p) : null;
}

function saveExtra() {
  try {
    var keep = {};
    M.faqs.forEach(function (f) {
      [f.qKey].concat(f.cKeys).forEach(function (k) { if (M.extra[k]) keep[k] = M.extra[k]; });
    });
    localStorage.setItem(EXTRA_KEY, JSON.stringify({ model: MODEL, items: keep }));
  } catch (err) { /* not kept; worked out again next time */ }
}

// Give every FAQ its fingerprints, working out with the model any that
// ask.html doesn't carry (text published since it was last refreshed).
async function attachFingerprints() {
  var todo = [];
  M.faqs.forEach(function (f) {
    if (!lookup(f.qKey)) todo.push({ key: f.qKey, text: questionText(f) });
    f.cKeys.forEach(function (k, n) {
      if (!lookup(k)) todo.push({ key: k, text: chunkText(f, f.chunks[n]) });
    });
  });
  if (todo.length) {
    await ensureModel();
    for (var i = 0; i < todo.length; i += 16) {
      setStatus('Reading new FAQ text… ' + Math.min(i + 16, todo.length) + ' of ' + todo.length);
      var slice = todo.slice(i, i + 16);
      var vecs = await embed(slice.map(function (j) { return j.text; }));
      slice.forEach(function (j, n) { M.extra[j.key] = pack(vecs[n]); });
    }
    saveExtra();
  }
  M.faqs.forEach(function (f) {
    f.qVec = lookup(f.qKey);
    f.cVecs = f.cKeys.map(lookup).filter(Boolean);
  });
  return todo.length;
}

// What each dot stands for. "Whole answers": the question and every passage
// of its answer, blended into one point. "Questions only": the question as
// ask.html reads it (which includes its tab and section).
function chooseVectors() {
  M.faqs.forEach(function (f) {
    f.vec = M.mode === 'question' ? f.qVec : MeaningMap.blend(f.qVec, f.cVecs);
  });
  M.sim = MeaningMap.similarities(M.faqs.map(function (f) { return f.vec; }));
}

function similar(i) {
  var n = M.faqs.length, out = [];
  for (var j = 0; j < n; j++) if (j !== i) out.push({ i: j, s: M.sim[i * n + j] });
  out.sort(function (a, b) { return b.s - a.s; });
  return out;
}

// ------------------------------------------------------------ the model

var pending = {}, nextId = 1, queue = Promise.resolve();

function ensureModel() {
  if (M.modelReady) return M.modelReady;
  var blob = new Blob([$('workerSource').textContent], { type: 'text/javascript' });
  M.worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
  M.worker.onmessage = function (ev) {
    var msg = ev.data;
    if (msg.type === 'progress') {
      if (msg.status === 'progress' && /onnx$/.test(msg.file)) {
        setStatus('Loading the language model… ' + Math.round(msg.progress) + '%');
      }
      return;
    }
    var p = pending[msg.id];
    delete pending[msg.id];
    if (p) msg.ok ? p.resolve(msg) : p.reject(new Error(msg.error));
  };
  M.worker.onerror = function (ev) {
    var err = new Error(ev.message || 'The model could not start');
    Object.keys(pending).forEach(function (id) { pending[id].reject(err); delete pending[id]; });
  };
  setStatus('Loading the language model (about 23 MB, first time only)…');
  M.modelReady = send({ type: 'load', model: MODEL, base: new URL('.', location.href).href });
  M.modelReady.catch(function () { M.modelReady = null; });
  return M.modelReady;
}

function send(msg) {
  return new Promise(function (resolve, reject) {
    msg.id = nextId++;
    pending[msg.id] = { resolve: resolve, reject: reject };
    M.worker.postMessage(msg);
  });
}

function embed(texts) {
  var job = queue.then(async function () {
    var out = await send({ type: 'embed', texts: texts });
    var dim = out.dims[out.dims.length - 1];
    var vecs = [];
    for (var i = 0; i < texts.length; i++) vecs.push(out.data.slice(i * dim, (i + 1) * dim));
    return vecs;
  });
  queue = job.catch(function () {});
  return job;
}

// ------------------------------------------------------------ the map

var map = MeaningMap.create({
  info: function (i) {
    var f = M.faqs[i];
    return f ? { title: f.q, sub: f.tabLabel + (f.group ? ' › ' + f.group : '') } : null;
  },
  onSelect: function (i) { select(i); },
  onSpot: function (x, y) { pickSpot(x, y); },
  onLegend: function (key) {
    M.focusKey = M.focusKey === key ? null : key;
    M.selected = -1;
    M.probe = null;
    M.spot = null;
    showOverview();
    paint();
  }
});
$('stage').appendChild(map.el);

function colourOf(f) {
  return M.colourBy === 'cluster' ? M.groups.list[M.groups.of[f.i]].colour : f.tab.colour;
}

/** Hand the map everything it needs to draw the current state. */
function paint(extra) {
  if (!M.layout) return;
  var focus = null, links = null, star = null;
  if (M.spot) {
    // The answers the spot is read from, heavier lines for the nearer.
    var from = M.spot.reading.near.slice(0, SPOT_LINES);
    focus = {};
    from.forEach(function (m) { focus[m.i] = true; });
    links = { from: { x: M.spot.x, y: M.spot.y }, to: from.map(function (m) { return { i: m.i, s: 0.45 + m.w }; }) };
  } else if (M.selected >= 0) {
    focus = {};
    focus[M.selected] = true;
    M.neighbours.forEach(function (m) { focus[m.i] = true; });
    links = { from: M.selected, to: M.neighbours };
  } else if (M.probe) {
    focus = {};
    M.probe.matches.forEach(function (m) { focus[m.i] = true; });
    links = { from: { x: M.probe.x, y: M.probe.y }, to: M.probe.matches };
    star = { x: M.probe.x, y: M.probe.y };
  } else if (M.focusKey) {
    focus = {};
    M.faqs.forEach(function (f) {
      var key = M.colourBy === 'cluster' ? 'c' + M.groups.of[f.i] : f.tabId;
      if (key === M.focusKey) focus[f.i] = true;
    });
  }
  var legend = M.colourBy === 'cluster'
    ? M.groups.list.map(function (g, gi) { return { key: 'c' + gi, label: g.label, colour: g.colour, on: M.focusKey === 'c' + gi }; })
    : M.tabs.map(function (t) { return { key: t.id, label: t.label, colour: t.colour, on: M.focusKey === t.id }; });
  var names = M.colourBy === 'cluster'
    ? M.groups.list.filter(function (g, gi) { return !M.focusKey || M.focusKey === 'c' + gi; }).map(function (g) {
        var h = MeaningMap.heart(g.members, M.layout.Y);
        return { x: h.x, y: h.y, label: g.label, colour: g.colour };
      })
    : [];
  var state = {
    points: M.faqs.map(function (f) { return { colour: colourOf(f) }; }),
    focus: focus, selected: M.selected, links: links, star: star, names: names, legend: legend,
    spot: M.spot ? { x: M.spot.x, y: M.spot.y } : null,
    settling: !M.layout.done, message: ''
  };
  if (extra) Object.keys(extra).forEach(function (k) { state[k] = extra[k]; });
  map.set(state);
}

function runLayout() {
  if (M.stop) M.stop();
  M.layout = MeaningMap.layout(M.sim, M.faqs.length, M.seed);
  M.probe = null;
  M.spot = null;
  $('reshuffle').disabled = true;
  var first = true;
  M.stop = MeaningMap.run(M.layout, function (lay) {
    if (first) { paint({ pos: lay.Y }); first = false; } else paint();
    if (!lay.done) setStatus('Arranging by meaning… ' + Math.round(lay.iter / lay.total * 100) + '%');
  }, function () {
    M.stop = null;
    $('reshuffle').disabled = false;
    readyStatus();
    paint();
    if (M.pendingProbe) { var t = M.pendingProbe; M.pendingProbe = null; place(t); }
  });
}

function rebuild() {
  chooseVectors();
  M.groups = MeaningMap.groups(M.faqs.map(function (f) { return f.vec; }),
    M.faqs.map(function (f) { return f.words; }), M.seed);
  M.selected = -1;
  M.neighbours = [];
  M.focusKey = null;
  showOverview();
  runLayout();
}

// ------------------------------------------------------------ the side panel

function dotHtml(colour) { return '<i style="background:' + colour + '"></i>'; }

function faqButton(i, extra) {
  var f = M.faqs[i];
  return '<button type="button" data-faq="' + i + '">' + dotHtml(colourOf(f)) +
    '<span class="q">' + esc(f.q) + (extra && extra.note ? '<span class="other' + (extra.plain ? ' plain' : '') + '">' + esc(extra.note) + '</span>' : '') + '</span>' +
    (extra && extra.score != null ? '<span class="score">' + Math.round(extra.score * 100) + '%</span>' : '') +
    '</button>';
}

function answerHtml(html) {
  var box = document.createElement('div');
  box.innerHTML = html;
  box.querySelectorAll('a[href]').forEach(function (a) {
    var href = a.getAttribute('href');
    if (href.charAt(0) === '#') a.setAttribute('href', PUBLIC_FAQ + href);
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
  });
  box.querySelectorAll('[style]').forEach(function (el) { el.removeAttribute('style'); });
  box.querySelectorAll('script, iframe, object').forEach(function (el) { el.remove(); });
  return box.innerHTML;
}

function showOverview() {
  var faqs = M.faqs, n = faqs.length;
  if (!n || !M.sim) return;

  // The most alike pairs: possible overlaps worth a look.
  var pairs = [];
  for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
    var s = M.sim[i * n + j];
    if (s >= DUPLICATE) pairs.push({ a: i, b: j, s: s });
  }
  pairs.sort(function (x, y) { return y.s - x.s; });
  pairs = pairs.slice(0, 10);

  // Answers whose nearest neighbours in meaning are mostly on other tabs.
  var strays = [];
  faqs.forEach(function (f, k) {
    var near = similar(k).slice(0, 5);
    var away = near.filter(function (m) { return faqs[m.i].tabId !== f.tabId; });
    if (away.length >= 4) {
      var where = {};
      away.forEach(function (m) { where[faqs[m.i].tabLabel] = (where[faqs[m.i].tabLabel] || 0) + 1; });
      var top = Object.keys(where).sort(function (x, y) { return where[y] - where[x]; })[0];
      strays.push({ i: k, note: f.tabLabel + ' tab · its neighbours are mostly on ' + top, s: near[0].s });
    }
  });
  strays.sort(function (x, y) { return y.s - x.s; });

  var html = '<h2>The FAQ, arranged by meaning</h2>' +
    '<p class="soft">Each dot is one published answer. The language model behind <a href="ask.html">Ask</a> ' +
    'reads every answer, and answers it thinks are about the same thing are drawn close together — ' +
    'whatever tab they are on. Colours are the tabs, so a colour turning up in another colour’s patch ' +
    'is an answer the model would file somewhere else.</p>' +
    '<p class="soft">Hover or tap a dot to read it. Drag to move, scroll or pinch to zoom. ' +
    'Type a question above to see where it lands, or tap empty space to see what question the model ' +
    'would put there. The same map is in Process Hub’s ' +
    '<a href="index.html#/probe">Probe</a> section, drawn from the draft.</p>' +
    '<p class="soft">An experiment: positions show which answers are near each other, not exact distances, ' +
    'and the model knows general English rather than Council’s terms.</p>';

  html += '<h3>Possible overlaps</h3>';
  html += pairs.length
    ? '<p class="soft">Pairs of answers the model reads as very alike. Some are meant to be (the same question on two tabs); others may be worth merging or cross-linking.</p>' +
      pairs.map(function (p) {
        return '<div class="pair"><ul class="list"><li>' +
          faqButton(p.a, { score: p.s, note: faqs[p.a].tabLabel }) + '</li><li>' +
          faqButton(p.b, { note: faqs[p.b].tabLabel }) + '</li></ul></div>';
      }).join('')
    : '<p class="soft">No two answers are read as near-identical.</p>';

  html += '<h3>Answers far from their tab</h3>';
  html += strays.length
    ? '<p class="soft">Most of their five nearest answers are on other tabs. They may be general questions, or candidates for a link from the other tab.</p>' +
      '<ul class="list">' + strays.slice(0, 12).map(function (st) { return '<li>' + faqButton(st.i, { note: st.note }) + '</li>'; }).join('') + '</ul>'
    : '<p class="soft">Every answer sits among answers from its own tab.</p>';

  html += '<h3>Meaning groups</h3><p class="soft">The model’s own grouping, ignoring tabs, named after the words each group uses most. Choose <em>Colour by: Meaning group</em> to see them.</p>' +
    '<ul class="list">' + M.groups.list.map(function (g, gi) {
      var tabsIn = {};
      g.members.forEach(function (i) { tabsIn[faqs[i].tabLabel] = true; });
      return '<li><button type="button" data-group="' + gi + '">' + dotHtml(g.colour) +
        '<span class="q">' + esc(g.label) + '<span class="other plain">' +
        esc(Object.keys(tabsIn).join(', ')) + '</span></span><span class="score">' + g.members.length + '</span></button></li>';
    }).join('') + '</ul>';

  $('panel').innerHTML = html;
  $('panel').scrollTop = 0;
}

function showFaq(i) {
  var f = M.faqs[i];
  var html = '<p><button class="btn" type="button" data-back="1">← Overview</button></p>' +
    '<div class="crumb">' + dotHtml(f.tab.colour) + esc(f.tabLabel + (f.group ? ' › ' + f.group : '')) + '</div>' +
    '<h2>' + esc(f.q) + '</h2>' +
    '<p class="soft">Meaning group: ' + esc(M.groups.list[M.groups.of[i]].label) + '</p>' +
    '<div class="answer">' + answerHtml(f.a) + '</div>' +
    '<p class="soft" style="margin-top:8px"><a href="' + esc(PUBLIC_FAQ + '#' + f.tabId) + '" target="_blank" rel="noopener">Open the ' +
    esc(f.tabLabel) + ' tab of the FAQ</a></p>' +
    '<h3>Closest in meaning</h3><ul class="list">' +
    M.neighbours.map(function (m) {
      var g = M.faqs[m.i];
      return '<li>' + faqButton(m.i, { score: m.s, note: g.tabId !== f.tabId ? 'on the ' + g.tabLabel + ' tab' : '' }) + '</li>';
    }).join('') + '</ul>';
  $('panel').innerHTML = html;
  $('panel').scrollTop = 0;
}

function showProbe() {
  var p = M.probe;
  var html = '<p><button class="btn" type="button" data-back="1">← Overview</button></p>' +
    '<h2>“' + esc(p.text) + '”</h2>' +
    '<p class="soft">The star shows where the model places this question, among the answers it reads as closest. ' +
    'The percentages are how alike it finds the question and the closest part of each answer. ' +
    'This is the model on its own: Ask and Probe also weigh the words themselves, so they find Council’s own terms better.</p>' +
    '<ul class="list">' + p.matches.map(function (m) {
      return '<li>' + faqButton(m.i, { score: m.s, note: M.faqs[m.i].tabLabel }) + '</li>';
    }).join('') + '</ul>';
  $('panel').innerHTML = html;
  $('panel').scrollTop = 0;
}

function select(i) {
  M.selected = i;
  M.probe = null;
  M.spot = null;
  M.neighbours = i >= 0 ? similar(i).slice(0, NEIGHBOURS) : [];
  if (i >= 0) showFaq(i); else showOverview();
  paint();
  if (i >= 0) map.revealDot(i);
}

$('panel').addEventListener('click', function (ev) {
  var b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.back) { M.probe = null; M.focusKey = null; select(-1); return; }
  if (b.dataset.hint != null) { $('searchInput').value = b.dataset.hint; place(b.dataset.hint); return; }
  if (b.dataset.faq != null) { select(+b.dataset.faq); return; }
  if (b.dataset.group != null) {
    if (M.colourBy !== 'cluster') { M.colourBy = 'cluster'; $('colourSelect').value = 'cluster'; }
    M.focusKey = 'c' + b.dataset.group;
    M.selected = -1;
    paint();
  }
});

// ------------------------------------------------------------ placing a question

async function place(text) {
  text = text.trim();
  if (!text || !M.faqs.length) return;
  if (M.stop) { M.pendingProbe = text; return; }   // wait for the map to settle
  $('searchBtn').disabled = true;
  try {
    await ensureModel();
    setStatus('Reading your question…');
    var v = (await embed([text]))[0];
    // Scored as ask.html scores (without its keyword help): the best of the
    // question and each passage of the answer, so one sentence can match.
    var scored = M.faqs.map(function (f) {
      var s = MeaningMap.dot(v, f.qVec);
      f.cVecs.forEach(function (c) { s = Math.max(s, MeaningMap.dot(v, c)); });
      return { i: f.i, s: s };
    }).sort(function (a, b) { return b.s - a.s; }).slice(0, NEIGHBOURS);
    var spot = MeaningMap.placeAmong(scored, M.layout.Y);
    M.probe = { text: text, x: spot.x, y: spot.y, matches: scored };
    M.spot = null;
    M.selected = -1;
    M.focusKey = null;
    showProbe();
    paint();
    map.reveal(spot.x, spot.y);
    readyStatus();
  } catch (err) {
    console.error(err);
    setStatus('Couldn\'t read that: ' + err.message, 'error');
  } finally {
    $('searchBtn').disabled = false;
  }
}

$('searchForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  place($('searchInput').value);
});
// Start loading the model as soon as someone goes to type.
$('searchInput').addEventListener('focus', function () {
  if (M.groups) ensureModel().then(function () { if (!M.stop) readyStatus(); }, function () {});
});

// ------------------------------------------------------------ what would go here?
//
// Tapping empty space picks a spot. The model can only read, not write, so
// spot-hint.js estimates the spot's fingerprint from the answers around it,
// writes candidate questions from their phrases, and keeps the ones the
// model reads as closest to the spot. Stiff wording; an experiment.

function embedAll(texts) {
  return ensureModel().then(async function () {
    var out = [];
    for (var i = 0; i < texts.length; i += 32) out = out.concat(await embed(texts.slice(i, i + 32)));
    return out;
  });
}

function pickSpot(x, y) {
  if (!M.layout || M.stop) return;   // wait for the map to settle
  var reading = MeaningMap.spotVector(M.faqs.map(function (f) { return f.vec; }), M.layout.Y, x, y);
  var run = ++M.spotRun;
  M.spot = { x: x, y: y, reading: reading, hints: null, failed: false, run: run };
  M.selected = -1;
  M.probe = null;
  M.focusKey = null;
  showSpot();
  paint();
  setStatus('Writing suggestions…');

  SpotHint.suggest({
    vec: reading.vec,
    near: reading.near.map(function (m) { return { item: M.faqs[m.i], w: m.w }; }),
    corpus: M.faqs,
    embed: embedAll,
    questionVec: function (f) { return f.qVec; }
  }).then(function (hints) {
    if (!M.spot || M.spot.run !== run) return;
    M.spot.hints = hints;
    showSpot();
    readyStatus();
  }).catch(function (err) {
    console.error(err);
    if (!M.spot || M.spot.run !== run) return;
    M.spot.failed = true;
    showSpot();
    setStatus('Couldn\'t write suggestions: ' + err.message, 'error');
  });
}

function showSpot() {
  var sp = M.spot, r = sp.reading;
  var html = '<p><button class="btn" type="button" data-back="1">← Overview</button></p>' +
    '<h2>What would go here?</h2>' +
    '<p class="soft">' + (r.gap > EMPTY
      ? 'This is <strong>empty ground between topics</strong>, so its fingerprint is a blend of the answers around it.'
      : 'This spot is among existing answers, so questions here are probably close to ones the FAQ already has.') +
    '</p>';

  if (sp.failed) html += '<p class="soft">The suggestions couldn’t be worked out on this device.</p>';
  else if (!sp.hints) html += '<p class="soft">Writing suggestions…</p>';
  else if (!sp.hints.length) html += '<p class="soft">The answers here don’t give enough words to suggest a question.</p>';
  else {
    html += '<ul class="hints">' + sp.hints.map(function (h) {
      return '<li><button type="button" data-hint="' + esc(h.text) + '" title="Place it on the map">' + esc(h.text) + '</button>' +
        '<small>fits this spot ' + Math.round(h.fit * 100) + '%' +
        (h.nearest ? ' · nearest question: “' + esc(h.nearest.item.q) + '” ' + Math.round(h.nearest.s * 100) + '%' : '') +
        '</small></li>';
    }).join('') + '</ul>' +
      '<p class="soft">The model can only read, not write, so these are built from the phrases of the answers ' +
      'around the spot, set into everyday question shapes, and kept where the model reads them as closest ' +
      'to the spot. The wording is stiff — a glimpse of what the model thinks belongs here, not finished ' +
      'questions. Tap one to place it on the map.</p>';
  }

  html += '<h3>Read from</h3><ul class="list">' + r.near.slice(0, SPOT_LINES).map(function (m) {
    return '<li>' + faqButton(m.i, { score: m.w, note: M.faqs[m.i].tabLabel, plain: true }) + '</li>';
  }).join('') + '</ul><p class="soft">The percentages are how much each answer counts towards the spot.</p>';

  $('panel').innerHTML = html;
  $('panel').scrollTop = 0;
}

// ------------------------------------------------------------ controls

$('modeSelect').addEventListener('change', function () { M.mode = this.value; rebuild(); });
$('colourSelect').addEventListener('change', function () {
  M.colourBy = this.value;
  M.focusKey = null;
  if (M.selected >= 0) showFaq(M.selected); else if (!M.probe) showOverview();
  paint();
});
$('reshuffle').addEventListener('click', function () { M.seed++; M.selected = -1; showOverview(); runLayout(); });

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && (M.selected >= 0 || M.probe || M.spot)) { M.probe = null; select(-1); }
});

// ------------------------------------------------------------ start

async function start() {
  setStatus('Checking you are signed in…');
  await Gate.require({
    lede: 'The meaning map is a Process Hub tool for council staff. Sign in with your GitHub access token to open it.',
    opening: 'Signed in. Opening the meaning map…'
  });
  try {
    setStatus('Loading the FAQ…');
    map.set({ message: 'Loading the FAQ…' });
    await Promise.all([loadFaqs(), loadFingerprints()]);
    if (M.faqs.length < 5) throw new Error('Not enough published answers to map');
    M.workedOut = await attachFingerprints();
    rebuild();
  } catch (err) {
    console.error(err);
    setStatus('Couldn\'t start: ' + err.message, 'error');
    map.set({ message: 'The map couldn’t be drawn: ' + err.message });
  }
}

start();
</script>
</body>
